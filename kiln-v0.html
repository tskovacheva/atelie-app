<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F3F2EF">
<title>Глина · Подреждане на пещ</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
/* Прототип v0 на подреждането в пещ. Самостоятелна страница: не чете и не
   пише данните на Глина. Пази плана в localStorage на този браузър и във файл. */
:root{
  --bg:#F3F2EF;--surface:#fff;--text:#2F3437;--muted:#6E767B;
  --primary:#7B8D86;--primary-soft:#DCE4E0;--accent:#B86F52;
  --line:rgba(47,52,55,.12);--line2:rgba(47,52,55,.25);
  --ok:#5A7A6B;--okbg:#E8EEE9;--warn:#9A6A1E;--warnbg:#F6EEDC;--err:#A84A3C;--errbg:#F5E3DF;
  --chamber:#ECE8E1;--shelf:#DCCFBF;--post:#8A8178;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.45 Jost,system-ui,-apple-system,"Segoe UI",sans-serif}
header{max-width:760px;margin:0 auto;padding:14px 16px 4px;display:flex;align-items:flex-end;gap:12px}
header .t{flex:1;min-width:0}
h1{font:400 23px/1.15 'Tenor Sans',Georgia,serif;margin:0}
h2{font:400 17px/1.2 'Tenor Sans',Georgia,serif;margin:0 0 6px}
.sub{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
#status{font-size:12px;color:var(--muted);white-space:nowrap}
#status.bad{color:var(--err)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);max-width:760px;margin:0 auto;padding:6px 12px;display:flex;gap:4px}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:500 12px Jost,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:9px 2px;border-radius:9px;cursor:pointer}
nav button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.06)}
main{max-width:760px;margin:0 auto;padding:2px 16px 90px}
.card{background:var(--surface);border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.muted{color:var(--muted)} .small{font-size:12.5px}
label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 2px}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:9px;background:#fff;color:var(--text);min-width:0}
input[type=checkbox]{width:auto;padding:0}
textarea{min-height:60px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 0;min-width:0}
.row>.nogrow{flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--surface);color:var(--text);font:500 14px Jost,system-ui,sans-serif;padding:8px 12px;border-radius:9px;cursor:pointer;min-height:38px}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{font-size:13px;padding:5px 9px;min-height:32px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn[disabled]{opacity:.45;cursor:default}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs2{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}
.tabs2 .btn{flex:0 0 auto}
.tabs2 .btn.on{background:var(--text);border-color:var(--text);color:#fff}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--primary-soft);color:var(--text);white-space:nowrap}
.chip.err{background:var(--errbg);color:var(--err)} .chip.warn{background:var(--warnbg);color:var(--warn)} .chip.ok{background:var(--okbg);color:var(--ok)}
.iss{font-size:12.5px;margin-top:2px}
.iss.err{color:var(--err)} .iss.warn{color:var(--warn)}
.note{background:var(--warnbg);color:var(--warn);border-radius:9px;padding:8px 10px;font-size:13px;margin:8px 0}
.note.info{background:var(--primary-soft);color:var(--text)}
.it{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .b{flex:1;min-width:0}
.it .nm{font-weight:500}
.dot{flex:0 0 auto;width:14px;height:14px;border-radius:50%;margin-top:4px;border:1px solid rgba(0,0,0,.15)}
.it.sel{background:var(--primary-soft);margin:0 -8px;padding:9px 8px;border-radius:9px}
.svgwrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
svg{display:block;width:100%;height:auto}
svg text{font-family:Jost,system-ui,sans-serif}
.pc{cursor:grab}
.tray{display:flex;flex-wrap:wrap;gap:6px}
.tray .btn{font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--muted)}
pre{white-space:pre-wrap;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);padding:10px;border-radius:9px;margin:8px 0;max-height:420px;overflow:auto}
#print{display:none}
@media print{
  header,nav,main{display:none!important}
  #print{display:block;padding:0 6mm;font-size:11pt}
  #print .lv{break-inside:avoid;margin:0 0 6mm}
  #print svg{width:90mm}
  body{background:#fff}
}
</style>

<header>
  <div class="t"><div class="sub">Глина · прототип v0</div><h1>Подреждане на пещ</h1></div>
  <div id="status"></div>
</header>
<nav id="nav"></nav>
<main id="app"></main>

<script id="kiln-geo">
// Геометрия на подреждането — чисти функции, без DOM. Мерните единици са
// сантиметри. Началото е центърът на камерата, x надясно, y към „12 ч“
// (ориентир, който керамикът избира). Позициите са спрямо камерата, не спрямо
// плочата: така местенето на плоча не премества изделията, а проверката
// „извън плочата“ е една и съща за една и за няколко плочи.
var KilnGeo = (function () {
  function num(v) {
    if (v === '' || v == null) return null;
    var n = parseFloat(String(v).replace(',', '.'));
    return isFinite(n) ? n : null;
  }
  function r1(v) { return Math.round(v * 10) / 10; }
  function shelfOf(S, L) { return L ? (S.shelves || []).find(function (s) { return s.id === L.shelf; }) || null : null; }

  // Основата на изделието: кръг или завъртян правоъгълник. Без размер → null.
  function shapeOf(p, x, y) {
    x = x != null ? x : (num(p.x) || 0); y = y != null ? y : (num(p.y) || 0);
    if (p.shape === 'rect') {
      var w = num(p.w), d = num(p.depth);
      if (!(w > 0 && d > 0)) return null;
      var a = (num(p.rot) || 0) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
      return { kind: 'poly', pts: [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2]].map(function (q) {
        return [x + q[0] * c - q[1] * s, y + q[0] * s + q[1] * c];
      }) };
    }
    var dd = num(p.d);
    if (!(dd > 0)) return null;
    return { kind: 'circle', x: x, y: y, r: dd / 2 };
  }
  function toPoly(sh, n) {
    if (sh.kind === 'poly') return sh.pts;
    n = n || 64; var o = [];
    for (var i = 0; i < n; i++) { var a = 2 * Math.PI * i / n; o.push([sh.x + sh.r * Math.cos(a), sh.y + sh.r * Math.sin(a)]); }
    return o;
  }
  function xExtent(sh) {
    if (sh.kind === 'circle') return [sh.x - sh.r, sh.x + sh.r];
    var xs = sh.pts.map(function (q) { return q[0]; });
    return [Math.min.apply(null, xs), Math.max.apply(null, xs)];
  }
  // С колко сантиметра основата излиза извън плочата (≤ 0 = вътре).
  function overhang(sh, shelf) {
    if (!sh || !shelf) return null;
    if (shelf.shape === 'rect') {
      var W = num(shelf.w) / 2, D = num(shelf.depth) / 2;
      if (!(W > 0 && D > 0)) return null;
      if (sh.kind === 'circle') return Math.max(Math.abs(sh.x) + sh.r - W, Math.abs(sh.y) + sh.r - D);
      return Math.max.apply(null, sh.pts.map(function (q) { return Math.max(Math.abs(q[0]) - W, Math.abs(q[1]) - D); }));
    }
    var R = num(shelf.d) / 2;
    if (!(R > 0)) return null;
    if (sh.kind === 'circle') return Math.hypot(sh.x, sh.y) + sh.r - R;
    return Math.max.apply(null, sh.pts.map(function (q) { return Math.hypot(q[0], q[1]) - R; }));
  }
  function axes(P) {
    var o = [];
    for (var i = 0; i < P.length; i++) {
      var a = P[i], b = P[(i + 1) % P.length], nx = -(b[1] - a[1]), ny = b[0] - a[0], l = Math.hypot(nx, ny) || 1;
      o.push([nx / l, ny / l]);
    }
    return o;
  }
  function proj(P, ax) {
    var mn = Infinity, mx = -Infinity;
    for (var i = 0; i < P.length; i++) { var v = P[i][0] * ax[0] + P[i][1] * ax[1]; if (v < mn) mn = v; if (v > mx) mx = v; }
    return [mn, mx];
  }
  function convexIntersect(A, B) {
    var all = axes(A).concat(axes(B));
    for (var i = 0; i < all.length; i++) {
      var a = proj(A, all[i]), b = proj(B, all[i]);
      if (a[1] <= b[0] + 1e-9 || b[1] <= a[0] + 1e-9) return false;
    }
    return true;
  }
  function segDist(p, a, b) {
    var dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy;
    var t = L ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy);
  }
  function polyDist(A, B) {
    var m = Infinity, i, j;
    for (i = 0; i < A.length; i++) for (j = 0; j < B.length; j++) m = Math.min(m, segDist(A[i], B[j], B[(j + 1) % B.length]));
    for (i = 0; i < B.length; i++) for (j = 0; j < A.length; j++) m = Math.min(m, segDist(B[i], A[j], A[(j + 1) % A.length]));
    return m;
  }
  // Отстояние между две основи в см; отрицателно = застъпват се.
  function gapBetween(a, b) {
    if (a.kind === 'circle' && b.kind === 'circle') return Math.hypot(a.x - b.x, a.y - b.y) - a.r - b.r;
    var A = toPoly(a), B = toPoly(b);
    return convexIntersect(A, B) ? -1 : polyDist(A, B);
  }

  // Височините: плочата на ниво i лежи върху подпорите, които стоят на ниво i−1
  // (за най-долното — върху подпорите на дъното). Мястото над нивото е
  // височината на подпорите над него; над най-горното — до тавана на камерата.
  function stack(S, r) {
    var out = [], z = num(r.floorH) || 0, H = num(S.kiln && S.kiln.h);
    r.levels.forEach(function (L, i) {
      var sh = shelfOf(S, L), t = sh ? (num(sh.t) || 0) : 0, last = i === r.levels.length - 1;
      var bottom = z, top = z + t;
      var space = last ? (H != null ? H - top : null) : num(L.postH);
      out.push({ id: L.id, i: i, bottom: bottom, top: top, space: space, shelf: sh, last: last });
      if (!last) z = top + (num(L.postH) || 0);
    });
    return out;
  }

  function label(p) { return '#' + p.no + (p.name ? ' ' + p.name : ''); }

  // Всички проблеми по изделия и по нива. err = не става така; warn = не може да се провери.
  function check(S, r) {
    var st = stack(S, r), byP = {}, byL = {};
    var gap = Math.max(0, num(r.gap) || 0), clear = Math.max(0, num(r.clear) || 0), postR = (num(S.postD) || 4) / 2;
    var H = num(S.kiln && S.kiln.h), KD = num(S.kiln && S.kiln.d);
    function add(m, id, x) { (m[id] = m[id] || []).push(x); }
    st.forEach(function (s) {
      var L = r.levels[s.i];
      if (!s.shelf) add(byL, L.id, { sev: 'err', kind: 'shelf', msg: 'Нивото няма плоча' });
      else if (S.kiln.shape !== 'rect' && s.shelf.shape !== 'rect' && KD && num(s.shelf.d) > KD) add(byL, L.id, { sev: 'err', kind: 'shelfbig', msg: 'Плочата е по-голяма от камерата' });
      if (s.space != null && s.space <= 0) add(byL, L.id, { sev: 'err', kind: 'nospace', msg: s.last ? 'Нивото стига до тавана на камерата' : 'Няма височина над нивото' });
      if (s.last && H == null) add(byL, L.id, { sev: 'warn', kind: 'noh', msg: 'Височината на камерата не е зададена' });
      if (!s.last && s.space == null) add(byL, L.id, { sev: 'warn', kind: 'noh', msg: 'Височината на подпорите не е зададена' });
      var ps = r.pieces.filter(function (p) { return p.level === L.id; });
      var shapes = ps.map(function (p) { return [p, shapeOf(p)]; });
      var posts = s.last ? [] : (L.posts || []).map(function (q) { return { kind: 'circle', x: q.x, y: q.y, r: postR }; });
      shapes.forEach(function (pr, k) {
        var p = pr[0], sh = pr[1], h = num(p.h);
        if (!sh) add(byP, p.id, { sev: 'warn', kind: 'size', msg: 'Няма размер на основата — мястото не може да се провери' });
        else {
          var o = overhang(sh, s.shelf);
          if (o != null && o > 0.05) add(byP, p.id, { sev: 'err', kind: 'out', msg: 'Излиза от плочата с ' + r1(o) + ' см', v: o });
          posts.forEach(function (q, j) {
            if (gapBetween(sh, q) < 0.3) add(byP, p.id, { sev: 'err', kind: 'post', msg: 'Опира в подпора ' + (j + 1) });
          });
          for (var m = k + 1; m < shapes.length; m++) {
            var p2 = shapes[m][0], sh2 = shapes[m][1];
            if (!sh2) continue;
            var g = gapBetween(sh, sh2);
            if (g < -0.05 || g < gap - 0.05) {
              var w = g < -0.05 ? 'Застъпва се с ' : 'По-близо от ' + gap + ' см до ';
              add(byP, p.id, { sev: 'err', kind: 'hit', msg: w + label(p2), with: p2.id, v: g });
              add(byP, p2.id, { sev: 'err', kind: 'hit', msg: w + label(p), with: p.id, v: g });
            }
          }
        }
        if (h == null) add(byP, p.id, { sev: 'warn', kind: 'size', msg: 'Няма височина — не може да се провери' });
        else if (s.space != null && h + clear > s.space + 0.05)
          add(byP, p.id, { sev: 'err', kind: 'tall', msg: 'По-високо от мястото: ' + r1(h) + ' см, място ' + r1(s.space) + ' см' + (clear ? ' (с ' + clear + ' см отстояние)' : '') });
      });
    });
    return { stack: st, byP: byP, byL: byL };
  }

  // Подпори по подразбиране: n броя, равномерно, на 1,5 см от ръба; първата на 12 ч.
  function defaultPosts(shelf, n, postD) {
    if (!shelf) return [];
    n = n || 3; var pr = (num(postD) || 4) / 2, inset = pr + 1.5, o = [], i;
    if (shelf.shape === 'rect') {
      var W = num(shelf.w) / 2 - inset, D = num(shelf.depth) / 2 - inset;
      if (!(W > 0 && D > 0)) return [];
      var c = [[-W, D], [W, D], [W, -D], [-W, -D]];
      if (n === 3) c = [[0, D], [W, -D], [-W, -D]];
      return c.slice(0, n).map(function (q) { return { x: r1(q[0]), y: r1(q[1]) }; });
    }
    var R = num(shelf.d) / 2 - inset;
    if (!(R > 0)) return [];
    for (i = 0; i < n; i++) { var a = 2 * Math.PI * i / n; o.push({ x: r1(R * Math.sin(a)), y: r1(R * Math.cos(a)) }); }
    return o;
  }

  // Позиция като на часовник: „2 ч, 14 см от центъра“.
  function clock(x, y) {
    x = num(x) || 0; y = num(y) || 0;
    var d = Math.hypot(x, y);
    if (d < 2) return 'в центъра';
    var a = Math.atan2(x, y) * 180 / Math.PI; if (a < 0) a += 360;
    var h = Math.round(a / 30) % 12; if (h === 0) h = 12;
    return h + ' ч, ' + Math.round(d) + ' см от центъра';
  }

  // Първото свободно място: от ръба на плочата към центъра, като в пещ — ръбът
  // се запълва пръв, центърът остава за последните (или за най-високото).
  function findSpot(S, r, L, p) {
    var s = stack(S, r).find(function (x) { return x.id === L.id; });
    if (!s || !s.shelf) return null;
    var gap = Math.max(0, num(r.gap) || 0), postR = (num(S.postD) || 4) / 2;
    var others = r.pieces.filter(function (q) { return q.level === L.id && q.id !== p.id; }).map(function (q) { return shapeOf(q); }).filter(Boolean);
    var posts = s.last ? [] : (L.posts || []).map(function (q) { return { kind: 'circle', x: q.x, y: q.y, r: postR }; });
    var R = s.shelf.shape === 'rect' ? Math.hypot(num(s.shelf.w), num(s.shelf.depth)) / 2 : num(s.shelf.d) / 2;
    if (!(R > 0)) return null;
    for (var rad = Math.floor(R); rad >= 0; rad -= 1) {
      var steps = rad === 0 ? 1 : Math.max(8, Math.ceil(2 * Math.PI * rad / 1.5));
      for (var k = 0; k < steps; k++) {
        var a = 2 * Math.PI * k / steps, x = r1(rad * Math.sin(a)), y = r1(rad * Math.cos(a));
        var sh = shapeOf(p, x, y);
        if (!sh) return { x: x, y: y };
        var o = overhang(sh, s.shelf);
        if (o == null || o > 0.05) continue;
        var ok = others.every(function (q) { return gapBetween(sh, q) >= gap - 0.05 && gapBetween(sh, q) >= -0.05; }) &&
                 posts.every(function (q) { return gapBetween(sh, q) >= 0.3; });
        if (ok) return { x: x, y: y };
      }
    }
    return null;
  }

  // Височини, сглобими от наличните подпори: {15:[15], 20:[15,5], …}, най-малко парчета.
  function postCombos(sizes, max) {
    sizes = (sizes || []).map(num).filter(function (v) { return v > 0; });
    var U = 2, M = Math.round((num(max) || 60) * U), best = [[]];
    for (var h = 1; h <= M; h++) {
      best[h] = null;
      sizes.forEach(function (s) {
        var su = Math.round(s * U);
        if (su <= h && best[h - su] && (!best[h] || best[h - su].length + 1 < best[h].length)) best[h] = best[h - su].concat([s]);
      });
    }
    var out = {};
    for (h = 1; h <= M; h++) if (best[h]) out[h / U] = best[h].slice().sort(function (a, b) { return b - a; });
    return out;
  }

  // Размерите от свободния текст в Глина („в8 × ⌀6“, „⌀22“, „20×15×8“), в см.
  function parseDims(s) {
    s = String(s || '').replace(/,/g, '.');
    var o = {}, m;
    m = s.match(/(?:⌀|Ø|ø|Ф|ф|D|d)\s*(\d+(?:\.\d+)?)/); if (m) o.d = +m[1];
    m = s.match(/(?:в|В|h|H)\s*(\d+(?:\.\d+)?)/); if (m) o.h = +m[1];
    if (o.d == null && o.h == null) {
      var ns = (s.match(/\d+(?:\.\d+)?/g) || []).map(Number);
      if (ns.length >= 3) { o.w = ns[0]; o.depth = ns[1]; o.h = ns[2]; }
      else if (ns.length === 2) { o.d = ns[0]; o.h = ns[1]; }
      else if (ns.length === 1) o.d = ns[0];
    }
    return o;
  }

  return { num: num, r1: r1, shelfOf: shelfOf, shapeOf: shapeOf, xExtent: xExtent, overhang: overhang, gapBetween: gapBetween,
    stack: stack, check: check, defaultPosts: defaultPosts, clock: clock, findSpot: findSpot, postCombos: postCombos,
    parseDims: parseDims, label: label };
})();
if (typeof module !== 'undefined') module.exports = KilnGeo;
</script>

<script>
(function () {
'use strict';
var G = KilnGeo, num = G.num, r1 = G.r1;
var KEY = 'glina.kiln.v0';
var TYPES = { bisque: 'Бисквит', glaze: 'Глазура', other: 'Друго' };
var STATES = { planned: 'План', loaded: 'Заредено', completed: 'Приключено', interrupted: 'Прекъснато' };
var RESULTS = ['', 'Добре', 'Пукнато', 'Деформирано', 'Залепнало', 'Счупено', 'Друго'];
var CONE_RES = ['', 'Недоогрят', 'Точно', 'Преогрят'];
var STAGES = { wet: 'Сурово', 'leather-hard': 'Кожна влажност', 'bone-dry': 'Сухо', bisque: 'Бисквит', glazed: 'Глазирано', fired: 'Изпечено', finished: 'Готово', broken: 'Счупено', gifted: 'Подарено' };
var PALETTE = ['#B86F52', '#6E8F86', '#C9A227', '#7A6A9E', '#4F7CAC', '#9C5B3B', '#5A7A6B', '#C06C84', '#8C8C3E', '#3E6E6E'];

function uid(p) { return (p || 'k') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmtDate(d) { var m = /^(\d{4})-(\d\d)-(\d\d)/.exec(d || ''); return m ? m[3] + '.' + m[2] + '.' + m[1] : (d || ''); }
function fmtN(v) { v = num(v); return v == null ? '?' : String(r1(v)).replace('.', ','); }

function defaults() {
  return {
    v: 0,
    kiln: { name: 'Kittec CB 80 Double', shape: 'round', d: 50, w: null, depth: null, h: 45, checked: false, ref: '' },
    shelves: [{ id: 'sh-47', name: 'Кръгла Ø47', shape: 'round', d: 47, w: null, depth: null, t: 1.6, qty: 3 }],
    postSizes: [5, 10, 15], postD: 4,
    runs: [], cur: null
  };
}
function newRun(type) {
  var r = { id: uid('run-'), name: '', date: today(), type: type || 'bisque', gap: type === 'glaze' ? 1 : 0, clear: 0.5, floorH: 5,
    state: 'planned', confirmedAt: null, endedAt: null, levels: [], pieces: [], nextNo: 1, peak: '', program: '', notes: '', corrections: [], refireOf: null };
  addLevelTo(r);
  return r;
}
function addLevelTo(r) {
  var L = { id: uid('lv-'), shelf: (S.shelves[0] || {}).id || null, postH: 10, posts: [], cone: '', coneResult: '', note: '' };
  L.posts = G.defaultPosts(G.shelfOf(S, L), 3, S.postD);
  r.levels.push(L);
  return L;
}

// ---- съхранение ----
var S = null, saveOk = true;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || S.v !== 0 || !S.kiln) S = defaults();
if (!S.runs.length) { var r0 = newRun('bisque'); S.runs.push(r0); S.cur = r0.id; }
if (!S.runs.some(function (r) { return r.id === S.cur; })) S.cur = S.runs[0].id;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); saveOk = true; } catch (e) { saveOk = false; }
  var el = document.getElementById('status');
  el.textContent = saveOk ? 'записано на това устройство' : 'не се записва — изтегли файл';
  el.className = saveOk ? '' : 'bad';
}

// ---- състояние на екрана ----
var UI = { view: 'plan', level: null, sel: null, edit: null, imp: null, confirm: null, kilnOpen: false };
function run() { return S.runs.find(function (r) { return r.id === S.cur; }); }
function curLevel() {
  var r = run();
  if (!r.levels.some(function (L) { return L.id === UI.level; })) UI.level = r.levels[0] && r.levels[0].id;
  return r.levels.find(function (L) { return L.id === UI.level; });
}
function pieceById(id) { return run().pieces.find(function (p) { return p.id === id; }); }
function levelNo(r, id) { var i = r.levels.findIndex(function (L) { return L.id === id; }); return i < 0 ? null : i + 1; }
function clayColors(r) {
  var m = {}, k = 0;
  r.pieces.forEach(function (p) { var c = p.clay || '—'; if (!(c in m)) m[c] = PALETTE[k++ % PALETTE.length]; });
  return m;
}
function dims(p) {
  var base = p.shape === 'rect' ? fmtN(p.w) + '×' + fmtN(p.depth) : 'Ø' + fmtN(p.d);
  return base + ' × в' + fmtN(p.h) + ' см';
}
function issuesHtml(list) {
  return (list || []).map(function (x) { return '<div class="iss ' + x.sev + '">' + (x.sev === 'err' ? '✗ ' : '? ') + esc(x.msg) + '</div>'; }).join('');
}
function worst(list) { list = list || []; return list.some(function (x) { return x.sev === 'err'; }) ? 'err' : list.length ? 'warn' : ''; }

// Промяна на факт след потвърденото зареждане → ред в дневника на корекциите.
var TRACK = { piece: ['level', 'x', 'y', 'rot', 'h', 'd', 'w', 'depth', 'shape'], level: ['postH', 'shelf', 'cone', 'coneResult'], run: ['floorH'] };
function logChange(kind, obj, field, oldV, newV) {
  var r = run();
  if (r.state === 'planned' || String(oldV) === String(newV)) return;
  if (!(TRACK[kind] || []).includes(field)) return;
  var who = kind === 'piece' ? G.label(obj) : kind === 'level' ? 'Ниво ' + levelNo(r, obj.id) : 'Изпичане';
  r.corrections.push({ at: new Date().toISOString(), path: kind + ':' + obj.id + '.' + field, who: who, field: field, old: oldV == null ? null : oldV, new: newV == null ? null : newV, reason: '' });
}

// ---- изгледи ----
function render() {
  // Фокусът оцелява при прерисуване: „Напред“ на телефонната клавиатура
  // не бива да губи полето, в което човек току-що е влязъл.
  var ae = document.activeElement, fk = ae && (ae.dataset && ae.dataset.b ? '[data-b="' + ae.dataset.b + '"]' : ae.id ? '#' + ae.id : null);
  var r = run();
  document.getElementById('nav').innerHTML = [['plan', 'План'], ['pieces', 'Изделия (' + r.pieces.length + ')'], ['kiln', 'Пещ'], ['after', 'След'], ['file', 'Файл']].map(function (t) {
    return '<button data-act="view" data-id="' + t[0] + '" class="' + (UI.view === t[0] ? 'on' : '') + '">' + t[1] + '</button>';
  }).join('');
  var V = { plan: vPlan, pieces: vPieces, kiln: vKiln, after: vAfter, file: vFile }[UI.view] || vPlan;
  document.getElementById('app').innerHTML = V();
  if (fk) { var f = document.querySelector(fk); if (f && f.focus) { try { f.focus({ preventScroll: true }); } catch (e) {} } }
}
// Промяна в поле + докосване на бутон: „change“ идва при натискането, преди
// „click“. Ако прерисуваме веднага, бутонът изчезва и докосването се губи.
// Затова при натиснат пръст/мишка прерисуването чака click-а.
var pressing = false, pending = false;
document.addEventListener('pointerdown', function () { pressing = true; }, true);
document.addEventListener('pointerup', function () { setTimeout(function () { pressing = false; if (pending) { pending = false; render(); showFlash(); } }, 60); }, true);
function later() { if (pressing) pending = true; else setTimeout(function () { if (!pressing) { render(); showFlash(); } else pending = true; }, 0); }

function runHead(r) {
  var st = r.state || 'planned';
  var acts = '';
  if (st === 'planned') acts = '<button class="btn acc sm" data-act="state" data-id="loaded">Заредено — потвърди подреждането</button>';
  else if (st === 'loaded') acts = '<button class="btn pri sm" data-act="state" data-id="completed">Приключено</button><button class="btn sm" data-act="state" data-id="interrupted">Прекъснато</button><button class="btn ghost sm" data-act="state" data-id="planned" data-confirm>Обратно към план</button>';
  else acts = '<button class="btn ghost sm" data-act="state" data-id="loaded">Отвори отново</button>';
  return '<div class="card"><div class="row">' +
    '<div style="flex:2"><label class="f">Изпичане</label><input data-b="run|name" value="' + esc(r.name) + '" placeholder="напр. Бисквит — 5 глини"></div>' +
    '<div><label class="f">Дата</label><input type="date" data-b="run|date" value="' + esc(r.date) + '"></div></div>' +
    '<div class="row"><div><label class="f">Вид</label><select data-b="run|type">' + Object.keys(TYPES).map(function (k) { return '<option value="' + k + '"' + (r.type === k ? ' selected' : '') + '>' + TYPES[k] + '</option>'; }).join('') + '</select></div>' +
    '<div><label class="f">Отстояние между изделия, см</label><input inputmode="decimal" data-b="run|gap|n" value="' + esc(r.gap) + '"></div>' +
    '<div><label class="f">Под горната плоча, см</label><input inputmode="decimal" data-b="run|clear|n" value="' + esc(r.clear) + '"></div></div>' +
    '<div class="btns" style="align-items:center"><span class="chip ' + (st === 'completed' ? 'ok' : st === 'interrupted' ? 'err' : st === 'loaded' ? 'warn' : '') + '">' + STATES[st] + (r.confirmedAt ? ' · ' + fmtDate(r.confirmedAt.slice(0, 10)) : '') + '</span>' + acts + '</div>' +
    (st !== 'planned' ? '<div class="small muted" style="margin-top:6px">Промените по позиции, нива, подпори и конуси след потвърждението се записват в дневника на корекциите (раздел „След“).</div>' : '') +
    '</div>';
}

function vPlan() {
  var r = run(), L = curLevel(), chk = G.check(S, r), cols = clayColors(r);
  var st = chk.stack, s = st.find(function (x) { return x.id === L.id; });
  var h = runHead(r);
  if (!S.kiln.checked) h += '<div class="note">Размерите на камерата (Ø' + fmtN(S.kiln.d) + ', височина ' + fmtN(S.kiln.h) + ' см) са предполагаеми. Провери ги в раздел „Пещ“, иначе проверката за горното ниво е неточна.</div>';
  // страничен изглед
  h += '<div class="card"><h2>Нива отстрани</h2>' + sideSvg(r, chk, cols) +
    '<div class="row" style="margin-top:6px"><div><label class="f">Подпори на дъното, см</label>' + postSelect('run|floorH', r.floorH) + '</div>' +
    '<div class="nogrow"><button class="btn" data-act="addLevel">+ Ниво отгоре</button></div></div></div>';
  // табове на нивата (отгоре надолу)
  h += '<div class="tabs2">' + r.levels.map(function (x, i) { return [x, i]; }).reverse().map(function (xi) {
    var x = xi[0], i = xi[1], n = r.pieces.filter(function (p) { return p.level === x.id; }).length;
    var bad = worst((chk.byL[x.id] || []).concat.apply([], r.pieces.filter(function (p) { return p.level === x.id; }).map(function (p) { return chk.byP[p.id] || []; })));
    return '<button class="btn sm ' + (x.id === L.id ? 'on' : '') + '" data-act="lvl" data-id="' + x.id + '">Ниво ' + (i + 1) + (i === r.levels.length - 1 && r.levels.length > 1 ? ' · горе' : i === 0 ? ' · долу' : '') + ' (' + n + ')' + (bad ? ' <span class="chip ' + bad + '">' + (bad === 'err' ? '✗' : '?') + '</span>' : '') + '</button>';
  }).join('') + '</div>';
  // нивото
  var sel = UI.sel && pieceById(UI.sel);
  if (sel && sel.level !== L.id) sel = null;
  h += '<div class="card"><div class="row">' +
    '<div><label class="f">Плоча</label><select data-b="level:' + L.id + '|shelf">' + S.shelves.map(function (x) { return '<option value="' + x.id + '"' + (L.shelf === x.id ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '<option value=""' + (!L.shelf ? ' selected' : '') + '>— без плоча —</option></select></div>' +
    (s.last ? '' : '<div><label class="f">Подпори над нивото, см</label>' + postSelect('level:' + L.id + '|postH', L.postH) + '</div>') +
    '</div>' +
    '<div class="small muted" style="margin-top:6px">Плочата е на ' + fmtN(s.top) + ' см от дъното · място над нея: <b>' + (s.space == null ? '?' : fmtN(s.space)) + ' см</b>' +
    (s.last ? ' (до тавана)' : '') + '</div>' + issuesHtml(chk.byL[L.id]) +
    '<div class="svgwrap" style="margin-top:8px">' + topSvg(r, L, s, chk, cols) + '</div>' +
    '<div class="small muted">Влачи изделията и подпорите. 12 ч е ориентирът ' + (S.kiln.ref ? '(' + esc(S.kiln.ref) + ')' : '— задай го в „Пещ“') + '.</div>' +
    (s.last ? '' : '<div class="btns"><button class="btn sm" data-act="posts" data-id="3">3 подпори</button><button class="btn sm" data-act="posts" data-id="4">4 подпори</button></div>');
  if (sel) {
    h += '<div class="card" style="background:var(--bg);box-shadow:none;margin:10px 0 0"><div class="it" style="padding:0"><span class="dot" style="background:' + cols[sel.clay || '—'] + '"></span><div class="b"><div class="nm">' + esc(G.label(sel)) + '</div>' +
      '<div class="small muted">' + esc(sel.clay || 'без глина') + ' · ' + dims(sel) + ' · ' + G.clock(sel.x, sel.y) + '</div>' + issuesHtml(chk.byP[sel.id]) +
      '<div class="btns">' + (sel.shape === 'rect' ? '<button class="btn sm" data-act="rot" data-id="' + sel.id + '" data-d="-15">⟲ 15°</button><button class="btn sm" data-act="rot" data-id="' + sel.id + '" data-d="15">⟳ 15°</button>' : '') +
      '<select data-ch="toLevel" data-id="' + sel.id + '" style="width:auto">' + r.levels.map(function (x, i) { return '<option value="' + x.id + '"' + (x.id === sel.level ? ' selected' : '') + '>Ниво ' + (i + 1) + '</option>'; }).join('') + '</select>' +
      '<button class="btn sm" data-act="unplace" data-id="' + sel.id + '">Свали</button><button class="btn sm ghost" data-act="sel" data-id="">Затвори</button></div></div></div></div>';
  }
  if (r.levels.length > 1) h += '<div class="btns"><button class="btn sm ghost danger" data-act="delLevel" data-id="' + L.id + '" data-confirm>Махни това ниво</button></div>';
  h += '</div>';
  // неразположени
  var un = r.pieces.filter(function (p) { return !p.level; });
  h += '<div class="card"><h2>Неразположени (' + un.length + ')</h2>';
  if (!r.pieces.length) h += '<div class="muted small">Добави изделия в раздел „Изделия“ — на ръка или от архив на Глина.</div>';
  else if (!un.length) h += '<div class="muted small">Всички изделия са на нива.</div>';
  else {
    h += '<div class="small muted" style="margin-bottom:6px">Докосни, за да сложиш на ниво ' + levelNo(r, L.id) + ' на първото свободно място.</div><div class="tray">' +
      un.map(function (p) { return '<button class="btn sm" data-act="place" data-id="' + p.id + '"><span class="dot" style="margin:0;background:' + cols[p.clay || '—'] + '"></span>' + esc(G.label(p)) + ' <span class="muted">в' + fmtN(p.h) + '</span></button>'; }).join('') +
      '</div><div class="btns"><button class="btn sm pri" data-act="placeAll">Сложи всички, които се събират тук</button></div>';
  }
  h += '</div>';
  // изделията на нивото
  var on = r.pieces.filter(function (p) { return p.level === L.id; });
  if (on.length) {
    h += '<div class="card"><h2>На ниво ' + levelNo(r, L.id) + '</h2>' + on.map(function (p) {
      return '<div class="it ' + (UI.sel === p.id ? 'sel' : '') + '" data-act="sel" data-id="' + p.id + '"><span class="dot" style="background:' + cols[p.clay || '—'] + '"></span><div class="b"><div class="nm">' + esc(G.label(p)) + '</div><div class="small muted">' + esc(p.clay || 'без глина') + ' · ' + dims(p) + ' · ' + G.clock(p.x, p.y) + '</div>' + issuesHtml(chk.byP[p.id]) + '</div></div>';
    }).join('') + '</div>';
  }
  // легенда
  var ck = Object.keys(cols);
  if (ck.length) h += '<div class="card small">' + ck.map(function (c) { return '<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px"><span class="dot" style="margin:0;background:' + cols[c] + '"></span>' + esc(c) + ' (' + r.pieces.filter(function (p) { return (p.clay || '—') === c; }).length + ')</span>'; }).join('') + '</div>';
  return h;
}

function postSelect(bind, val) {
  var max = Math.max(num(S.kiln.h) || 60, 20), combos = G.postCombos(S.postSizes, max), v = num(val);
  var keys = Object.keys(combos).map(Number).sort(function (a, b) { return a - b; });
  var opts = '<option value="0"' + (v === 0 ? ' selected' : '') + '>0 — без подпори</option>';
  if (v != null && v !== 0 && !combos[v]) opts += '<option value="' + v + '" selected>' + fmtN(v) + ' — няма такава комбинация</option>';
  keys.forEach(function (k) { opts += '<option value="' + k + '"' + (v === k ? ' selected' : '') + '>' + fmtN(k) + (combos[k].length > 1 ? ' (' + combos[k].join('+') + ')' : '') + '</option>'; });
  return '<select data-b="' + bind + '|n">' + opts + '</select>';
}

// Изглед отгоре: камерата, плочата, подпорите и изделията на едно ниво.
function topSvg(r, L, s, chk, cols) {
  var K = S.kiln, R = K.shape === 'rect' ? Math.hypot(num(K.w) || 50, num(K.depth) || 50) / 2 : (num(K.d) || 50) / 2;
  var sh = s.shelf, m = R + 4, out = [];
  out.push('<svg id="top" viewBox="' + (-m) + ' ' + (-m) + ' ' + (2 * m) + ' ' + (2 * m) + '" data-lv="' + L.id + '">');
  if (K.shape === 'rect') out.push('<rect x="' + (-(num(K.w) || 50) / 2) + '" y="' + (-(num(K.depth) || 50) / 2) + '" width="' + (num(K.w) || 50) + '" height="' + (num(K.depth) || 50) + '" fill="var(--chamber)" stroke="var(--line2)" stroke-width=".3" stroke-dasharray="1 1"/>');
  else out.push('<circle r="' + R + '" fill="var(--chamber)" stroke="var(--line2)" stroke-width=".3" stroke-dasharray="1 1"/>');
  [['12', 0, -R - 1.6], ['3', R + 1.8, 0.7], ['6', 0, R + 3], ['9', -R - 1.8, 0.7]].forEach(function (t) {
    out.push('<text x="' + t[1] + '" y="' + t[2] + '" font-size="2.6" text-anchor="middle" fill="var(--muted)">' + t[0] + '</text>');
  });
  if (sh) {
    if (sh.shape === 'rect') out.push('<rect x="' + (-num(sh.w) / 2) + '" y="' + (-num(sh.depth) / 2) + '" width="' + num(sh.w) + '" height="' + num(sh.depth) + '" fill="var(--shelf)" stroke="#BCA98F" stroke-width=".3"/>');
    else if (sh.shape === 'half') out.push('<path d="M ' + (-num(sh.d) / 2) + ' -0.4 A ' + num(sh.d) / 2 + ' ' + num(sh.d) / 2 + ' 0 0 1 ' + num(sh.d) / 2 + ' -0.4 Z M ' + (-num(sh.d) / 2) + ' 0.4 A ' + num(sh.d) / 2 + ' ' + num(sh.d) / 2 + ' 0 0 0 ' + num(sh.d) / 2 + ' 0.4 Z" fill="var(--shelf)" stroke="#BCA98F" stroke-width=".3"/>');
    else out.push('<circle r="' + num(sh.d) / 2 + '" fill="var(--shelf)" stroke="#BCA98F" stroke-width=".3"/>');
  }
  out.push('<line x1="0" y1="' + (-R) + '" x2="0" y2="' + (-R + 2.5) + '" stroke="var(--muted)" stroke-width=".4"/>');
  if (!s.last) (L.posts || []).forEach(function (q, j) {
    var pr = (num(S.postD) || 4) / 2;
    out.push('<g data-drag="post" data-id="' + j + '" class="pc"><circle cx="' + q.x + '" cy="' + (-q.y) + '" r="' + pr + '" fill="var(--post)" stroke="#fff" stroke-width=".3"/><text x="' + q.x + '" y="' + (-q.y + 0.9) + '" font-size="2.4" text-anchor="middle" fill="#fff">' + (j + 1) + '</text></g>');
  });
  r.pieces.filter(function (p) { return p.level === L.id; }).forEach(function (p) {
    var shp = G.shapeOf(p), bad = worst(chk.byP[p.id]), col = cols[p.clay || '—'];
    var stroke = bad === 'err' ? 'var(--err)' : UI.sel === p.id ? 'var(--text)' : '#fff', sw = bad === 'err' || UI.sel === p.id ? 0.7 : 0.3;
    var x = num(p.x) || 0, y = num(p.y) || 0;
    out.push('<g data-drag="piece" data-id="' + p.id + '" class="pc">');
    if (!shp) out.push('<circle cx="' + x + '" cy="' + (-y) + '" r="3" fill="' + col + '" fill-opacity=".5" stroke="var(--warn)" stroke-width=".5" stroke-dasharray="1 .6"/>');
    else if (shp.kind === 'circle') out.push('<circle cx="' + x + '" cy="' + (-y) + '" r="' + shp.r + '" fill="' + col + '" fill-opacity=".78" stroke="' + stroke + '" stroke-width="' + sw + '"/>');
    else out.push('<polygon points="' + shp.pts.map(function (q) { return r1(q[0]) + ',' + r1(-q[1]); }).join(' ') + '" fill="' + col + '" fill-opacity=".78" stroke="' + stroke + '" stroke-width="' + sw + '"/>');
    out.push('<text x="' + x + '" y="' + (-y + 1) + '" font-size="2.8" text-anchor="middle" fill="#fff" stroke="rgba(0,0,0,.35)" stroke-width=".25" paint-order="stroke" pointer-events="none">' + p.no + '</text></g>');
  });
  out.push('</svg>');
  return out.join('');
}

// Изглед отстрани (проекция отпред): нива, подпори и изделия по височина.
function sideSvg(r, chk, cols) {
  var K = S.kiln, W = K.shape === 'rect' ? (num(K.w) || 50) : (num(K.d) || 50), H = num(K.h);
  var st = chk.stack, topMost = st.length ? st[st.length - 1].top : 0;
  var Hd = Math.max(H || 0, topMost + 5, 20);
  r.pieces.forEach(function (p) { var s = st.find(function (x) { return x.id === p.level; }); if (s && num(p.h)) Hd = Math.max(Hd, s.top + num(p.h) + 2); });
  var mx = W / 2 + 12, out = [];
  out.push('<svg viewBox="' + (-mx) + ' ' + (-Hd - 3) + ' ' + (2 * mx) + ' ' + (Hd + 7) + '" style="max-height:340px">');
  out.push('<rect x="' + (-W / 2) + '" y="' + (-(H || Hd)) + '" width="' + W + '" height="' + (H || Hd) + '" fill="var(--chamber)" stroke="var(--line2)" stroke-width=".3"' + (H ? '' : ' stroke-dasharray="1 1"') + '/>');
  var postW = num(S.postD) || 4;
  // подпори на дъното
  st.forEach(function (s, i) {
    var L = r.levels[i], below = i === 0 ? { top: 0 } : st[i - 1];
    var postsBelow = i === 0 ? [{ x: -W / 2 + 6 }, { x: W / 2 - 6 }] : (r.levels[i - 1].posts || []);
    postsBelow.forEach(function (q) { out.push('<rect x="' + (q.x - postW / 4) + '" y="' + (-s.bottom) + '" width="' + postW / 2 + '" height="' + Math.max(0, s.bottom - below.top) + '" fill="var(--post)" opacity=".6" pointer-events="none"/>'); });
    var sw = s.shelf ? (s.shelf.shape === 'rect' ? num(s.shelf.w) : num(s.shelf.d)) : W * 0.9;
    var on = L.id === UI.level;
    out.push('<g data-act="lvl" data-id="' + L.id + '" style="cursor:pointer"><rect x="' + (-sw / 2) + '" y="' + (-s.top) + '" width="' + sw + '" height="' + Math.max(0.8, s.top - s.bottom) + '" fill="' + (s.shelf ? '#BCA98F' : 'var(--err)') + '"/>' +
      '<rect x="' + (-mx) + '" y="' + (-(s.top + Math.max(s.space || 3, 3))) + '" width="' + (2 * mx) + '" height="' + Math.max(s.space || 3, 3) + '" fill="' + (on ? 'rgba(123,141,134,.12)' : 'transparent') + '"/>' +
      '<text x="' + (W / 2 + 1.5) + '" y="' + (-s.top + 0.5) + '" font-size="2.6" fill="var(--text)">' + (i + 1) + '</text>' +
      '<text x="' + (W / 2 + 1.5) + '" y="' + (-s.top - 2.6) + '" font-size="2.1" fill="var(--muted)">' + (s.space == null ? '?' : fmtN(s.space)) + '</text></g>');
    r.pieces.filter(function (p) { return p.level === L.id; }).forEach(function (p) {
      var shp = G.shapeOf(p), ph = num(p.h); if (!shp || !ph) return;
      var ex = G.xExtent(shp), tall = (chk.byP[p.id] || []).some(function (x) { return x.kind === 'tall'; });
      out.push('<rect x="' + r1(ex[0]) + '" y="' + r1(-(s.top + ph)) + '" width="' + r1(ex[1] - ex[0]) + '" height="' + ph + '" fill="' + cols[p.clay || '—'] + '" fill-opacity=".55" stroke="' + (tall ? 'var(--err)' : '#fff') + '" stroke-width="' + (tall ? 0.7 : 0.2) + '" pointer-events="none"/>');
    });
  });
  out.push('<text x="' + (-mx + 1) + '" y="' + (-(H || Hd) + 2.5) + '" font-size="2.2" fill="var(--muted)">' + (H ? 'таван ' + fmtN(H) + ' см' : 'височината не е зададена') + '</text>');
  out.push('<line x1="' + (-mx) + '" y1="0" x2="' + mx + '" y2="0" stroke="var(--text)" stroke-width=".4"/>');
  out.push('</svg>');
  return out.join('');
}

function summary(r) {
  var chk = G.check(S, r), L = [], st = chk.stack;
  L.push(TYPES[r.type] + (r.name ? ' · ' + r.name : '') + ' · ' + fmtDate(r.date) + ' · ' + STATES[r.state || 'planned']);
  L.push(S.kiln.name + ' · ' + (S.kiln.shape === 'rect' ? fmtN(S.kiln.w) + '×' + fmtN(S.kiln.depth) : 'Ø' + fmtN(S.kiln.d)) + ' × ' + fmtN(S.kiln.h) + ' см' + (S.kiln.ref ? ' · 12 ч = ' + S.kiln.ref : ''));
  L.push('Подпори на дъното: ' + fmtN(r.floorH) + ' см');
  st.slice().reverse().forEach(function (s) {
    var lv = r.levels[s.i], combos = G.postCombos(S.postSizes, 100);
    L.push('');
    L.push('НИВО ' + (s.i + 1) + (s.last ? ' (горе)' : '') + ' — ' + (s.shelf ? s.shelf.name : 'без плоча') + ', място ' + (s.space == null ? '?' : fmtN(s.space)) + ' см' +
      (s.last ? '' : ', подпори над него ' + fmtN(lv.postH) + ' см' + (combos[num(lv.postH)] && combos[num(lv.postH)].length > 1 ? ' (' + combos[num(lv.postH)].join('+') + ')' : '')) + (lv.cone ? ', конус ' + lv.cone + (lv.coneResult ? ' — ' + lv.coneResult : '') : ''));
    (chk.byL[lv.id] || []).forEach(function (x) { L.push('  ' + (x.sev === 'err' ? '✗ ' : '? ') + x.msg); });
    r.pieces.filter(function (p) { return p.level === lv.id; }).forEach(function (p) {
      L.push('  ' + G.label(p) + ' — ' + (p.clay || 'без глина') + ' — ' + dims(p) + ' — ' + G.clock(p.x, p.y) + (p.result ? ' — ' + p.result : '') + (p.note ? ' (' + p.note + ')' : ''));
      (chk.byP[p.id] || []).forEach(function (x) { L.push('     ' + (x.sev === 'err' ? '✗ ' : '? ') + x.msg); });
    });
  });
  var un = r.pieces.filter(function (p) { return !p.level; });
  if (un.length) { L.push(''); L.push('НЕРАЗПОЛОЖЕНИ'); un.forEach(function (p) { L.push('  ' + G.label(p) + ' — ' + (p.clay || '') + ' — ' + dims(p)); }); }
  if (r.peak || r.program || r.notes) { L.push(''); if (r.peak) L.push('Връх: ' + r.peak + ' °C'); if (r.program) L.push('Програма: ' + r.program); if (r.notes) L.push(r.notes); }
  return L.join('\n');
}

  var r = run(), old = p.level, ox = p.x, oy = p.y;
  var prev = p.level; p.level = L.id;
  var spot = G.findSpot(S, r, L, p);
  if (!spot) { p.level = prev; return false; }
  p.x = spot.x; p.y = spot.y;
  logChange('piece', p, 'level', old ? 'ниво ' + levelNo(r, old) : 'неразположено', 'ниво ' + levelNo(r, L.id));
  if (old) { logChange('piece', p, 'x', ox, p.x); logChange('piece', p, 'y', oy, p.y); }
  return true;
}
function fitsHeight(p, s) { var h = num(p.h); return h == null || s.space == null || h + (num(run().clear) || 0) <= s.space + 0.05; }
var flash = null;
var ACT = {
  view: function (id) { UI.view = id; UI.edit = null; window.scrollTo(0, 0); },
  lvl: function (id) { UI.level = id; UI.sel = null; },
  sel: function (id) { UI.sel = id || null; },
  addLevel: function () { var L = addLevelTo(run()); UI.level = L.id; },
  delLevel: function (id) { var r = run(); r.pieces.forEach(function (p) { if (p.level === id) p.level = null; }); r.levels = r.levels.filter(function (L) { return L.id !== id; }); UI.level = null; },
  posts: function (n) { var L = curLevel(); L.posts = G.defaultPosts(G.shelfOf(S, L), +n, S.postD); },
  place: function (id) {
    var p = pieceById(id), L = curLevel();
    if (!placeOn(p, L)) { flash = 'Няма свободно място за ' + G.label(p) + ' на това ниво.'; return; }
    UI.sel = id;
  },
  placeAll: function () {
    var r = run(), L = curLevel(), s = G.stack(S, r).find(function (x) { return x.id === L.id; }), n = 0, skip = 0;
    r.pieces.filter(function (p) { return !p.level; })
      .sort(function (a, b) { return (num(b.d) || num(b.w) || 0) - (num(a.d) || num(a.w) || 0); })
      .forEach(function (p) { if (!fitsHeight(p, s)) { skip++; return; } if (placeOn(p, L)) n++; else skip++; });
    flash = 'Сложени: ' + n + (skip ? ' · не се събират тук: ' + skip : '') + '.';
  },
  unplace: function (id) { var p = pieceById(id), r = run(); logChange('piece', p, 'level', 'ниво ' + levelNo(r, p.level), 'неразположено'); p.level = null; UI.sel = null; },
  rot: function (id, b) { var p = pieceById(id), o = num(p.rot) || 0, v = ((o + (+b.dataset.d)) % 360 + 360) % 360; logChange('piece', p, 'rot', o, v); p.rot = v; },
  addPiece: function () {
    var r = run(), g = function (k) { var e = document.getElementById('np-' + k); return e ? e.value.trim() : ''; };
    var qty = Math.max(1, Math.min(200, parseInt(g('qty'), 10) || 1)), name = g('name');
    for (var i = 1; i <= qty; i++) r.pieces.push({ id: uid('pc-'), no: r.nextNo++, name: qty > 1 ? (name || 'Изделие') + ' /' + i : name, clay: g('clay'), shape: g('shape') || 'round', d: num(g('d')), w: num(g('w')), depth: num(g('depth')), h: num(g('h')), rot: 0, level: null, x: 0, y: 0, result: '', note: '', ref: null });
    UI.np = { shape: g('shape') || 'round', clay: g('clay') };
    flash = 'Добавени: ' + qty + '. Сложи ги на нива в „План“.';
  },
  editPiece: function (id) { UI.edit = UI.edit === id ? null : id; },
  delPiece: function (id) { var r = run(); r.pieces = r.pieces.filter(function (p) { return p.id !== id; }); UI.edit = null; },
  addShelf: function () { S.shelves.push({ id: uid('sh-'), name: 'Нова плоча', shape: 'round', d: 40, w: null, depth: null, t: 1.5, qty: 1 }); },
  delShelf: function (id) { S.shelves = S.shelves.filter(function (x) { return x.id !== id; }); S.runs.forEach(function (r) { r.levels.forEach(function (L) { if (L.shelf === id) L.shelf = null; }); }); },
  state: function (st) {
    var r = run(), now = new Date().toISOString();
    if (st === 'loaded' && !r.confirmedAt) r.confirmedAt = now;
    if (st === 'planned') { r.confirmedAt = null; }
    if (st === 'completed' || st === 'interrupted') r.endedAt = now;
    r.state = st;
  },
  newRun: function (t) { var r = newRun(t); S.runs.unshift(r); S.cur = r.id; UI.level = null; UI.sel = null; UI.view = 'plan'; },
  openRun: function (id) { S.cur = id; UI.level = null; UI.sel = null; },
  refire: function () {
    var o = run(), r = JSON.parse(JSON.stringify(o)), map = {};
    r.id = uid('run-'); r.refireOf = o.id; r.state = 'planned'; r.confirmedAt = null; r.endedAt = null; r.corrections = []; r.date = today(); r.peak = ''; r.notes = '';
    r.name = (o.name || TYPES[o.type]) + ' — повторно';
    r.levels.forEach(function (L) { var n = uid('lv-'); map[L.id] = n; L.id = n; L.cone = ''; L.coneResult = ''; L.note = ''; });
    r.pieces.forEach(function (p) { p.id = uid('pc-'); p.level = p.level ? map[p.level] || null : null; p.result = ''; p.note = ''; });
    S.runs.unshift(r); S.cur = r.id; UI.level = null; UI.view = 'plan';
  },
  delRun: function () { S.runs = S.runs.filter(function (x) { return x.id !== S.cur; }); S.cur = S.runs[0].id; UI.level = null; },
  export: function () {
    var r = run(), blob = new Blob([JSON.stringify({ kind: 'glina-kiln-v0', exportedAt: new Date().toISOString(), data: S }, null, 1)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'glina-pech-' + (r.date || today()) + '.json'; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  },
  copy: function () {
    var t = summary(run());
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { flash = 'Копирано.'; render(); showFlash(); }, function () { selectSum(); });
    else selectSum();
  },
  print: function () {
    var r = run(), chk = G.check(S, r), cols = clayColors(r);
    var keepSel = UI.sel; UI.sel = null;
    document.getElementById('print').innerHTML = '<pre style="background:none;max-height:none;font-size:10pt">' + esc(summary(r)) + '</pre>' + chk.stack.slice().reverse().map(function (s) {
      return '<div class="lv"><b>Ниво ' + (s.i + 1) + '</b>' + topSvg(r, r.levels[s.i], s, chk, cols) + '</div>';
    }).join('');
    UI.sel = keepSel;
    window.print();
  },
  impAll: function (v) { UI.imp.items.forEach(function (it) { if (UI.imp.showAll || it.suggest || it.on) it.on = v === '1'; }); },
  impCancel: function () { UI.imp = null; },
  impAdd: function () {
    var r = run(), n = 0;
    UI.imp.items.filter(function (it) { return it.on; }).forEach(function (it) {
      var q = Math.max(1, Math.min(200, parseInt(it.qty, 10) || 1));
      for (var i = 1; i <= q; i++) {
        r.pieces.push({ id: uid('pc-'), no: r.nextNo++, name: it.name + (q > 1 || it.series ? ' /' + (it.unitFrom + i - 1) : ''), clay: it.clay, shape: 'round', d: num(it.d), w: null, depth: null, h: num(it.h), rot: 0, level: null, x: 0, y: 0, result: '', note: '',
          ref: { kind: it.series ? 'series' : 'piece', id: it.id, unit: q > 1 || it.series ? it.unitFrom + i - 1 : null } });
        n++;
      }
    });
    UI.imp = null; flash = 'Добавени от Глина: ' + n + '.';
  }
};
function selectSum() { var e = document.getElementById('sum'); if (!e) return; var rg = document.createRange(); rg.selectNodeContents(e); var sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg); flash = 'Текстът е маркиран — копирай го.'; showFlash(); }

function readGlina(text) {
  var j = JSON.parse(text), db = j && (j.db || (j.payload && j.payload.db) || j);
  if (!db || !Array.isArray(db.pieces)) throw new Error('Това не прилича на архив на Глина.');
  var mats = {}; (db.materials || []).forEach(function (m) { mats[m.id] = m.name; });
  var clay = function (c) { return c ? (mats[c] || c) : ''; };
  var want = run().type === 'glaze' ? ['bisque', 'glazed'] : ['wet', 'leather-hard', 'bone-dry', 'greenware'];
  var items = [], used = {};
  db.pieces.forEach(function (p) {
    if (p.seriesId) used[p.seriesId] = (used[p.seriesId] || 0) + (parseInt(p.qty, 10) || 1);
    var dd = G.parseDims(p.dimensions), q = parseInt(p.qty, 10) || 1;
    items.push({ id: p.id, name: p.name || 'Изделие', clay: clay(p.clay), stage: p.stage, dimText: p.dimensions || '', d: dd.d != null ? dd.d : (dd.w != null ? Math.max(dd.w, dd.depth) : ''), h: dd.h != null ? dd.h : '', qty: q,
      series: false, unitFrom: p.seriesNo || 1, suggest: want.indexOf(p.stage) >= 0 });
  });
  (db.series || []).forEach(function (s) {
    var dd = G.parseDims(s.dimensions), left = Math.max(0, (parseInt(s.count, 10) || 0) - (used[s.id] || 0));
    if (!left) return;
    items.push({ id: s.id, name: s.name || 'Серия', clay: clay(s.clay), stage: s.stage, dimText: s.dimensions || '', d: dd.d != null ? dd.d : '', h: dd.h != null ? dd.h : '', qty: left,
      series: true, unitFrom: 1, suggest: want.indexOf(s.stage) >= 0 });
  });
  items.forEach(function (it) { it.on = it.suggest; });
  items.sort(function (a, b) { return (b.suggest - a.suggest) || String(a.clay).localeCompare(String(b.clay)); });
  return { items: items, when: j.exportedAt ? fmtDate(String(j.exportedAt).slice(0, 10)) : 'файла', showAll: false };
}

var CH = {
  toLevel: function (el) { var p = pieceById(el.dataset.id), r = run(), L = r.levels.find(function (x) { return x.id === el.value; }); if (!placeOn(p, L)) flash = 'Няма свободно място на ниво ' + levelNo(r, L.id) + '.'; else { UI.level = L.id; } },
  npShape: function (el) { UI.np = Object.assign({}, UI.np || {}, { shape: el.value, name: (document.getElementById('np-name') || {}).value, clay: (document.getElementById('np-clay') || {}).value }); },
  postSizes: function (el) { var v = el.value.split(/[,; ]+/).map(num).filter(function (x) { return x > 0; }); if (v.length) S.postSizes = v; },
  corrReason: function (el) { run().corrections[+el.dataset.id].reason = el.value; },
  glinaFile: function (el) {
    var f = el.files && el.files[0]; if (!f) return;
    f.text().then(function (t) { try { UI.imp = readGlina(t); } catch (e) { UI.imp = { error: 'Файлът не може да се прочете: ' + e.message }; } render(); });
    return 'async';
  },
  impOn: function (el) { UI.imp.items[+el.dataset.id].on = el.checked; return 'nosave'; },
  impF: function (el) { var it = UI.imp.items[+el.dataset.id]; it[el.dataset.f] = el.value; it.on = true; return 'nosave'; },
  impShowAll: function (el) { UI.imp.showAll = el.checked; return 'nosave'; },
  importFile: function (el) {
    var f = el.files && el.files[0]; if (!f) return;
    f.text().then(function (t) {
      try {
        var j = JSON.parse(t), d = j && j.kind === 'glina-kiln-v0' ? j.data : null;
        if (!d || !Array.isArray(d.runs)) throw new Error('не е файл от тази страница');
        var have = {}; S.runs.forEach(function (r) { have[r.id] = 1; });
        var added = d.runs.filter(function (r) { return !have[r.id]; });
        S.runs = added.concat(S.runs);
        if (S.runs.length === added.length || !S.kiln.checked) { S.kiln = d.kiln; S.shelves = d.shelves; S.postSizes = d.postSizes; S.postD = d.postD; }
        if (added.length) S.cur = added[0].id;
        flash = 'Внесени изпичания: ' + added.length + (d.runs.length - added.length ? ' (вече ги има: ' + (d.runs.length - added.length) + ')' : '') + '.';
      } catch (e) { flash = 'Файлът не може да се внесе: ' + e.message; }
      save(); render(); showFlash();
    });
    return 'async';
  }
};

function bind(el) {
  var parts = el.dataset.b.split('|'), spec = parts[0], field = parts[1], kind = parts[2];
  var k = spec.split(':')[0], id = spec.split(':')[1], r = run();
  var obj = k === 'run' ? r : k === 'kiln' ? S.kiln : k === 'S' ? S : k === 'piece' ? pieceById(id) : k === 'level' ? r.levels.find(function (L) { return L.id === id; }) : k === 'shelf' ? S.shelves.find(function (x) { return x.id === id; }) : null;
  if (!obj) return;
  var v = kind === 'n' ? num(el.value) : kind === 'b' ? el.checked : el.value;
  var old = obj[field];
  obj[field] = v;
  logChange(k, obj, field, old, v);
  if (k === 'level' && field === 'shelf' && !(obj.posts || []).length) obj.posts = G.defaultPosts(G.shelfOf(S, obj), 3, S.postD);
  if (k === 'run' && field === 'type' && !r.pieces.length) r.gap = v === 'glaze' ? 1 : 0;
}

function showFlash() {
  if (!flash) return;
  var n = document.createElement('div'); n.className = 'note info'; n.textContent = flash; flash = null;
  n.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;max-width:728px;margin:0 auto;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.12)';
  document.body.appendChild(n); setTimeout(function () { n.remove(); }, 3500);
}

var app = document.getElementById('app');
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  if (e.target.closest('input,select,textarea') && b.tagName !== 'BUTTON') return;
  var a = b.dataset.act, id = b.dataset.id, key = a + ':' + (id || '');
  if (b.hasAttribute('data-confirm') && UI.confirm !== key) {
    UI.confirm = key; b.textContent = 'Натисни пак, за да потвърдиш'; b.classList.add('danger');
    setTimeout(function () { if (UI.confirm === key) { UI.confirm = null; render(); } }, 4000);
    return;
  }
  UI.confirm = null;
  if (!ACT[a]) return;
  ACT[a](id, b, e);
  pending = false;
  if (a !== 'copy' && a !== 'print' && a !== 'export') { save(); render(); }
  showFlash();
});
app.addEventListener('change', function (e) {
  var el = e.target, res;
  if (el.dataset.b) bind(el);
  else if (el.dataset.ch && CH[el.dataset.ch]) res = CH[el.dataset.ch](el);
  else return;
  if (res === 'async') return;
  if (res !== 'nosave') save();
  if (el.dataset.ch === 'impOn' || el.dataset.ch === 'impF' || el.dataset.ch === 'corrReason') return;
  later();
});

// ---- влачене в изгледа отгоре ----
var drag = null;
function svgPoint(svg, e) { var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; var q = pt.matrixTransform(svg.getScreenCTM().inverse()); return { x: q.x, y: -q.y }; }
app.addEventListener('pointerdown', function (e) {
  var g = e.target.closest('[data-drag]'); if (!g) return;
  var svg = g.ownerSVGElement, r = run(), L = curLevel(), p0 = svgPoint(svg, e);
  var obj = g.dataset.drag === 'piece' ? pieceById(g.dataset.id) : L.posts[+g.dataset.id];
  drag = { g: g, svg: svg, kind: g.dataset.drag, obj: obj, ox: num(obj.x) || 0, oy: num(obj.y) || 0, sx: p0.x, sy: p0.y, moved: false, L: L };
  try { svg.setPointerCapture(e.pointerId); } catch (x) {}
  e.preventDefault();
});
app.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var p = svgPoint(drag.svg, e), dx = p.x - drag.sx, dy = p.y - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) < 0.6) return;
  drag.moved = true;
  drag.obj.x = Math.round((drag.ox + dx) * 2) / 2; drag.obj.y = Math.round((drag.oy + dy) * 2) / 2;
  drag.g.setAttribute('transform', 'translate(' + (drag.obj.x - drag.ox) + ',' + (-(drag.obj.y - drag.oy)) + ')');
});
function endDrag() {
  if (!drag) return;
  var d = drag; drag = null;
  if (d.kind === 'piece') {
    if (d.moved) { logChange('piece', d.obj, 'x', d.ox, d.obj.x); logChange('piece', d.obj, 'y', d.oy, d.obj.y); }
    UI.sel = d.obj.id;
  } else if (d.moved) logChange('level', d.L, 'posts', '', '');
  save(); render();
}
app.addEventListener('pointerup', endDrag);
app.addEventListener('pointercancel', endDrag);

save(); render();
window.__kiln = { S: function () { return S; }, G: G, summary: function () { return summary(run()); } };
})();
