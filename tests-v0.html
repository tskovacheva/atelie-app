<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тестове · прототип v0</title>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Прототип „Тестове“ (v0). Самостоятелен, примерни данни в паметта.
   Не чете и не пише данните на Глина. */
:root{
  --bg:#F3F2EF;--surface:#FFFFFF;--text:#2F3437;--muted:#646C71;--primary:#6F837B;--primary-d:#56685F;
  --primary-soft:#DCE4E0;--bg2:#E8E7E4;--bdr:rgba(47,52,55,.10);--bdr2:rgba(47,52,55,.22);
  --tx2:#41474A;--ok:#4F7362;--okbg:#E5EEE8;--warn:#A9603F;--warnbg:#F6E9E2;--err:#9E4234;--errbg:#F5E3DF;
  --r:14px;--shadow:0 2px 10px rgba(0,0,0,.05);--tile:#ECE9E3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Jost',sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
button{cursor:pointer}
h1,h2,h3{font-family:'Tenor Sans',sans-serif;font-weight:400}
.proto{position:sticky;top:0;z-index:30;background:rgba(243,242,239,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--bdr)}
.proto .in{max-width:1400px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.proto b{font-weight:500;font-size:14px;color:var(--muted);margin-right:auto}
.proto select{min-height:38px;border:1.5px solid var(--bdr2);border-radius:10px;background:var(--surface);padding:4px 8px;font-size:14px;max-width:60vw}
.page{max-width:1400px;margin:0 auto;padding:0 16px 130px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media(min-width:1100px){.wrap.split{grid-template-columns:minmax(0,1fr) 560px;align-items:start}
  .wrap.split .col-det{position:sticky;top:60px;max-height:calc(100vh - 70px);overflow:auto}
  .back{display:none!important}}
@media(max-width:1099px){.wrap.det .col-list{display:none}.wrap.list .col-det{display:none}}
@media(min-width:1100px){.wrap.list .col-det{display:none}}
.head{display:flex;align-items:flex-end;gap:10px;padding:18px 0 8px;flex-wrap:wrap}
.head h1{font-size:30px;margin-right:auto}
.cnt{font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 16px;border-radius:12px;border:1.5px solid var(--bdr2);background:var(--surface);font-size:15px;font-weight:500;text-align:center}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.on{background:var(--text);border-color:var(--text);color:#fff}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn.ghost{border-color:transparent;background:none;color:var(--primary-d)}
.btn.warn{border-color:var(--err);color:var(--err)}
.btn:disabled{opacity:.45}
.tag-new{display:inline-block;font-size:11px;font-weight:500;background:#FFF3D6;color:#7A5A12;border-radius:6px;padding:1px 6px;vertical-align:middle;margin-left:4px;white-space:nowrap}
.tag-fut{display:inline-block;font-size:11px;font-weight:500;background:#ECE7F4;color:#5B4A7A;border-radius:6px;padding:1px 6px;vertical-align:middle;margin-left:4px;white-space:nowrap}
.ver{display:inline-flex;padding:1px 7px;border-radius:7px;font-size:12px;font-weight:600;background:var(--primary-soft);color:var(--primary-d);vertical-align:middle}
.ver.old{background:var(--warnbg);color:var(--warn)}
.kind{display:inline-flex;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:500;background:#E1ECF0;color:#3E6170;white-space:nowrap}
.kind.body{background:#EDE3D6;color:#7B5B3A}
.def{display:inline-flex;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--errbg);color:var(--err);white-space:nowrap}
.okd{display:inline-flex;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--okbg);color:var(--ok);white-space:nowrap}
.stars{color:#B98A2E;letter-spacing:1px;white-space:nowrap}
.stars i{color:#D8D3C8;font-style:normal}
/* каталог */
.kinds{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.kinds::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--bdr2);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:38px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip .n{opacity:.7;font-size:12.5px;margin-left:3px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 8px}
.search{flex:1 1 200px;min-width:0}
.search input{width:100%;min-height:46px;padding:10px 14px;border:1.5px solid var(--bdr2);border-radius:12px;background:var(--surface);outline:none}
select.sel{min-height:46px;padding:8px 10px;border:1.5px solid var(--bdr2);border-radius:12px;background:var(--surface);font-size:15px}
.seg{display:inline-flex;background:var(--bg2);border-radius:12px;padding:3px}
.seg button{border:none;background:none;padding:7px 11px;border-radius:9px;font-size:14px;min-height:40px;color:var(--tx2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:500}
.fs{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
.fs h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:10px 0 6px}
.fs h4:first-child{margin-top:0}
.fs .chips{display:flex;gap:6px;flex-wrap:wrap}
.active{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.achip{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary-d);border:none;border-radius:999px;padding:5px 12px;font-size:14px;min-height:34px}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.gal{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.wrap.split .gal{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.tc{position:relative;display:flex;flex-direction:column;text-align:left;width:100%;background:var(--surface);border:2px solid transparent;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;padding:0}
.tc.sel{border-color:var(--primary)}
.tc.pick{border-color:var(--text)}
.tc .ph{position:relative;aspect-ratio:1;background:var(--tile);display:flex;align-items:center;justify-content:center}
.tc .ph{overflow:hidden}
.tc .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.tc .ph .n{position:absolute;right:7px;bottom:7px;background:rgba(47,52,55,.72);color:#fff;font-size:11.5px;padding:1px 7px;border-radius:999px}
.tc .ph .noph{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:13px;border:1.5px dashed var(--bdr2);border-radius:10px;padding:14px 10px;margin:14px;text-align:center}
.tc .ck{position:absolute;left:8px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);border:2px solid var(--bdr2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.tc.pick .ck{background:var(--text);border-color:var(--text);color:#fff}
.tc .b{padding:9px 10px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tc .nm{font-size:15px;font-weight:500;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tc .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.lst{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.lr{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bdr);width:100%;text-align:left;border-left:3px solid transparent;border-top:none;border-right:none;background:none}
.lr:last-child{border-bottom:none}
.lr.sel{border-left-color:var(--primary);background:#F7F8F6}
.lr.pick{border-left-color:var(--text);background:#F1F0EE}
.lr .th{width:56px;height:56px;border-radius:10px;background:var(--tile);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center;line-height:1.1}
.lr .th img{width:100%;height:100%;object-fit:contain}
.lr .b{flex:1;min-width:0}
.lr .nm{font-size:15px;font-weight:500}
.lr .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12.5px;white-space:nowrap}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.cbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;background:var(--text);color:#fff;border-radius:16px;padding:10px 12px 10px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:calc(100% - 24px)}
.cbar .t{font-size:14.5px}
.cbar .btn{min-height:40px}
/* детайл */
.dh{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-top:14px}
.hero{background:var(--tile);aspect-ratio:4/3;max-height:min(58vh,460px);width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.hero{overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.hero .nav{position:absolute;bottom:10px;right:10px;display:flex;gap:6px;align-items:center}
.hero .nav button{border:none;background:rgba(255,255,255,.9);border-radius:50%;width:36px;height:36px;font-size:17px;box-shadow:var(--shadow)}
.hero .nav span{background:rgba(47,52,55,.72);color:#fff;font-size:12px;border-radius:99px;padding:3px 9px}
.hero .noph{color:var(--muted);text-align:center;font-size:14px}
.thumbs{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto}
.thumbs img{width:56px;height:56px;border-radius:8px;object-fit:contain;background:var(--tile);border:2px solid transparent;cursor:pointer;flex-shrink:0}
.thumbs img.on{border-color:var(--primary)}
.dh .in{padding:12px 16px 16px}
.dh h2{font-size:25px;line-height:1.15;margin:6px 0 2px}
.dh .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dh .sub{font-size:14.5px;color:var(--tx2)}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
@media(min-width:700px){.res{grid-template-columns:repeat(4,minmax(0,1fr))}}
.res div{background:var(--bg);border-radius:12px;padding:10px 12px}
.res small{display:block;font-size:12px;color:var(--muted)}
.res b{font-weight:500;font-size:16px}
.res b.bad{color:var(--err)}.res b.good{color:var(--ok)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{font-size:13.5px;line-height:1.5;padding:9px 12px;border-radius:10px;margin-top:10px}
.note.w{background:var(--warnbg);color:var(--warn)}.note.i{background:var(--bg);color:var(--tx2)}
.sec{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);margin-top:12px;padding:14px 16px}
.sec h3{font-size:18px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.kv div small{display:block;font-size:12.5px;color:var(--muted)}
.kv div b{font-weight:500;font-size:15.5px}
.kv div b.no{color:var(--muted);font-weight:400}
.li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:none;background:none;border-top:1px solid var(--bdr);padding:9px 0}
.li:first-child{border-top:none}
.li .t{font-size:15px;font-weight:500}
.li .s{font-size:13px;color:var(--muted)}
.li .go{margin-left:auto;color:var(--muted)}
.notes{font-size:15.5px;line-height:1.6;white-space:pre-wrap;color:var(--tx2)}
/* сравнение */
.cmp-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 0 8px}
.cmp-head h1{font-size:28px;margin-right:auto}
.cmp{display:grid;gap:10px}
.cmp .col{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.cmp .col .ph{position:relative;aspect-ratio:1;max-height:min(46vh,380px);width:100%;overflow:hidden;background:var(--tile);display:flex;align-items:center;justify-content:center}
.cmp .col .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.cmp .col .ph .noph{color:var(--muted);font-size:13px}
.cmp .col .lab{display:flex;gap:8px;align-items:center;padding:8px 10px 0}
.cmp .col .L{width:26px;height:26px;border-radius:50%;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.cmp .col .nm{font-size:15px;font-weight:500;line-height:1.25;min-width:0}
.cmp .col .rows{padding:6px 10px 10px}
.cmp .col .rw{padding:6px 0;border-top:1px solid var(--bdr)}
.cmp .col .rw small{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cmp .col .rw b{font-weight:500;font-size:15px}
.cmp .col .rw.diff{background:linear-gradient(90deg,#FFF6DF,transparent)}
.cmp .col .rw.na b{color:var(--muted);font-weight:400}
/* телефон: две колони, при 3–4 — плочки 2×2; без хоризонтален скрол на страницата */
.cmp.n2,.cmp.n3,.cmp.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:900px){.cmp.n3{grid-template-columns:repeat(3,minmax(0,1fr))}.cmp.n4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cmp-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--tx2)}
.cmp-tools label{display:flex;gap:6px;align-items:center}
/* лист и формуляр */
.sh-bg{position:fixed;inset:0;background:rgba(30,32,33,.35);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:680px;max-height:94vh;display:flex;flex-direction:column;border-radius:20px 20px 0 0}
@media(min-width:700px){.sh-bg{align-items:center}.sh{border-radius:20px}}
.sh .hd{display:flex;align-items:center;gap:8px;padding:16px 16px 8px}
.sh .hd h2{font-size:22px;flex:1}
.sh .bdy{overflow:auto;padding:0 16px 16px;flex:1}
.sh .ft{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--bdr);background:var(--bg);border-radius:0 0 20px 20px}
.sh .ft .btn{flex:1}
.ftabs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;background:var(--bg2);border-radius:12px;padding:4px;margin:4px 0 12px}
@media(min-width:600px){.ftabs{grid-template-columns:repeat(4,1fr)}}
.ftabs button{border:none;background:none;border-radius:9px;min-height:44px;font-size:14.5px;color:var(--tx2);line-height:1.2}
.ftabs button small{display:block;font-size:11.5px;color:var(--muted)}
.ftabs button.on{background:var(--surface);color:var(--text);font-weight:500;box-shadow:var(--shadow)}
.f{margin-top:12px}
.f label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--bdr2);border-radius:12px;background:var(--surface)}
.f textarea{min-height:100px;resize:vertical}
.f .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.fr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fr3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{border:1.5px solid var(--bdr2);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:40px;font-size:14px}
.pick button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.rpick{display:flex;flex-direction:column;gap:6px}
.rpick button{display:flex;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--bdr2);background:var(--surface);border-radius:12px;padding:8px 12px;min-height:48px}
.rpick button.on{border-color:var(--primary);background:#F3F6F4}
.rpick button small{margin-left:auto;font-size:12.5px;color:var(--muted)}
.phs{display:flex;gap:8px;flex-wrap:wrap}
.phs img,.phs .add{width:84px;height:84px;border-radius:10px;object-fit:contain;background:var(--tile)}
.phs .add{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--bdr2);color:var(--muted);font-size:13px;text-align:center;cursor:pointer;line-height:1.2}
.lb{position:fixed;inset:0;z-index:80;background:rgba(20,22,23,.94);display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;border:none;background:rgba(255,255,255,.14);color:#fff;border-radius:50%;width:46px;height:46px;font-size:22px}
.lb .x{top:14px;right:14px}.lb .pv{left:12px;top:50%;transform:translateY(-50%)}.lb .nx{right:12px;top:50%;transform:translateY(-50%)}
.lb .ct{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;opacity:.85;text-align:center;max-width:90%}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:90;max-width:calc(100% - 24px);text-align:center}
</style>

<body>
<div class="proto"><div class="in">
  <b>Прототип · Тестове v0</b>
  <select aria-label="Сценарий" onchange="scenario(this.value);this.value=''">
    <option value="">Сценарий…</option>
    <option value="clays">1 · Една глазура на две глини</option>
    <option value="temps">2 · Една рецепта при две температури</option>
    <option value="vers">3 · Две версии на рецепта</option>
    <option value="defect">4 · Успешен и с дефекти</option>
    <option value="noph">5 · Без снимка, непълен</option>
    <option value="body">6 · Тестове на маса</option>
  </select>
  <button class="btn sm" onclick="resetDemo()">Нулирай</button>
</div></div>
<div class="page"><div class="wrap list" id="wrap">
  <section class="col-list" id="colList"></section>
  <section class="col-det" id="colDet"></section>
</div></div>
<div id="layer"></div><div id="lbx"></div>
<script>
'use strict';
// ── речници (като в Глина) ──
var FLOW=['Ниско','Средно','Силно','Много силно'];
var SURF=['Матова','Сатенена','Гланцова','Кристална','Текстурирана','Сурова / недопечена'];
var DEFS=['Няма','Пинхоли','Пукнатини','Отлепяне','Пълзене','Незастопен кварц','Мехури'];
var RATS=['1 ★','2 ★★','3 ★★★','4 ★★★★','5 ★★★★★'];

function saveF(){var t=F.t;
  if(t.kind==='glaze'&&!t.recipeId&&!t.materialId){F.tab='basic';drawForm();toast('Избери рецепта или готова глазура');return;}
  if(t.temp&&!(+t.temp>0)){F.tab='fire';drawForm();toast('Температурата трябва да е положително число');return;}
  t.updatedAt=new Date().toISOString();
  if(F.id){var i=D.tests.findIndex(function(x){return x.id===F.id;});D.tests[i]=t;closeSheet();go();toast('Обновено');}
  else{t.id='t'+Date.now();D.tests.push(t);closeSheet();openTest(t.id);toast('Добавено!');}}
function del(id){if(!confirm('Изтрий теста?'))return;D.tests=D.tests.filter(function(x){return x.id!==id;});S.picked=S.picked.filter(function(x){return x!==id;});S.id=null;go();toast('Изтрито');}
// ── навигация ──
function tog(k,v){var a=S[k],i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);go();}
function unset(k,v){if(Array.isArray(S[k]))S[k]=S[k].filter(function(x){return x!==v;});else S[k]='';go();}
function clearF(){S.rec=[];S.clay=[];S.temp=[];S.surf=[];S.def='';S.rat='';S.photo='';S.q='';go();}
function openTest(id){S.id=id;S.hi=0;go();if(window.innerWidth<1100)window.scrollTo(0,0);}
function closeTest(){S.id=null;go();}
function scenario(k){clearF();S.kind='';S.showCmp=false;S.cmp=false;S.picked=[];
  if(k==='clays'){S.picked=['t1','t2'];}else if(k==='temps'){S.picked=['t2','t3'];}else if(k==='vers'){S.picked=['t4','t5'];}else if(k==='defect'){S.picked=['t7','t6'];}
  else if(k==='noph'){openTest('t9');return;}else if(k==='body'){S.picked=['t10','t11'];}
  S.cmp=true;S.showCmp=true;go();window.scrollTo(0,0);}
function resetDemo(){D=seed();S={id:null,view:'gal',kind:'',q:'',rec:[],clay:[],temp:[],surf:[],def:'',rat:'',photo:'',sort:'date',cmp:false,picked:[],showCmp:false,onlyDiff:false,filters:false,hi:0};closeSheet();LB=null;drawLb();go();toast('Демото е нулирано');}
function go(){
  var w=document.getElementById('wrap');
  if(S.showCmp&&S.picked.length>=2){w.className='wrap list';document.getElementById('colList').innerHTML=cmpHtml();document.getElementById('colDet').innerHTML='';document.getElementById('cbar')&&document.getElementById('cbar').remove();return;}
  S.showCmp=false;
  w.className='wrap '+(S.id?'det split':'list');
  document.getElementById('colList').innerHTML=listHtml();
  document.getElementById('colDet').innerHTML=S.id?detHtml(T(S.id)):'';
  var bar=document.getElementById('cbar');if(bar)bar.remove();
  if(S.cmp){bar=document.createElement('div');bar.id='cbar';bar.className='cbar';bar.innerHTML='<span class="t">Избрани: '+S.picked.length+' от 2–4</span><button class="btn sm" onclick="S.picked=[];go()">Изчисти</button><button class="btn sm pri" '+(S.picked.length<2?'disabled':'')+' onclick="S.showCmp=true;go();window.scrollTo(0,0)">Сравни</button>';document.body.appendChild(bar);}
}
function goKeep(){var q=document.getElementById('q'),pos=q.selectionStart;document.getElementById('colList').innerHTML=listHtml();q=document.getElementById('q');q.focus();try{q.setSelectionRange(pos,pos);}catch(e){}}
window.addEventListener('keydown',function(e){if(e.key==='Escape'){if(LB){LB=null;drawLb();}else if(F&&document.querySelector('.sh-bg'))askClose();}if(LB&&e.key==='ArrowRight'){LB.i=(LB.i+1)%T(LB.id).photos.length;drawLb();}if(LB&&e.key==='ArrowLeft'){var n=T(LB.id).photos.length;LB.i=(LB.i+n-1)%n;drawLb();}});
go();
</script>
</body>
