<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рецепти · прототип v0</title>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Прототип „Рецепти и глазури“ (v0). Самостоятелен, примерни данни в паметта.
   Не чете и не пише данните на Глина. */
:root{
  --bg:#F3F2EF;--surface:#FFFFFF;--text:#2F3437;--muted:#646C71;--primary:#6F837B;--primary-d:#56685F;
  --primary-soft:#DCE4E0;--bg2:#E8E7E4;--bdr:rgba(47,52,55,.10);--bdr2:rgba(47,52,55,.22);
  --tx2:#41474A;--ok:#4F7362;--okbg:#E5EEE8;--warn:#A9603F;--warnbg:#F6E9E2;--err:#9E4234;--errbg:#F5E3DF;
  --r:14px;--shadow:0 2px 10px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Jost',sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
button{cursor:pointer}
h1,h2,h3,.serif{font-family:'Tenor Sans',sans-serif;font-weight:400}
.proto{position:sticky;top:0;z-index:30;background:rgba(243,242,239,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--bdr)}
.proto .in{max-width:1400px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.proto b{font-weight:500;font-size:14px;color:var(--muted);margin-right:auto}
.proto select{min-height:38px;border:1.5px solid var(--bdr2);border-radius:10px;background:var(--surface);padding:4px 8px;font-size:14px;max-width:60vw}
.page{max-width:1400px;margin:0 auto;padding:0 16px 120px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media(min-width:1100px){.wrap{grid-template-columns:420px minmax(0,1fr);align-items:start}
  .col-list{position:sticky;top:60px;max-height:calc(100vh - 70px);overflow:auto;padding-right:4px}
  .back{display:none!important}}
@media(max-width:1099px){.wrap.det .col-list{display:none}.wrap.list .col-det{display:none}}
.head{display:flex;align-items:flex-end;gap:10px;padding:18px 0 10px;flex-wrap:wrap}
.head h1{font-size:30px;margin-right:auto}
.cnt{font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 16px;border-radius:12px;border:1.5px solid var(--bdr2);background:var(--surface);font-size:15px;font-weight:500;text-align:center}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn.ghost{border-color:transparent;background:none;color:var(--primary-d)}
.btn.warn{border-color:var(--err);color:var(--err)}
.tag-new{display:inline-block;font-size:11px;font-weight:500;letter-spacing:.03em;background:#FFF3D6;color:#7A5A12;border-radius:6px;padding:1px 6px;vertical-align:middle;margin-left:4px;white-space:nowrap}
.tag-fut{display:inline-block;font-size:11px;font-weight:500;background:#ECE7F4;color:#5B4A7A;border-radius:6px;padding:1px 6px;vertical-align:middle;margin-left:4px;white-space:nowrap}
/* видове глазура — тонове като rtag в Глина */
.gt{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--bg2);color:var(--tx2);white-space:nowrap}
.gt.ash{background:#E9E4DC;color:#6A5D4A}.gt.matte{background:#E6E8E3;color:#55604F}.gt.gloss{background:#E1ECF0;color:#3E6170}
.gt.crystal{background:#E8E3F1;color:#5B4A7A}.gt.shino{background:#F3E4D8;color:#8F5A3A}.gt.celadon{background:#DDEBE3;color:#3F6A55}
.gt.tenmoku{background:#E8DCD3;color:#5E3B2B}
.cone{display:inline-flex;padding:2px 9px;border-radius:999px;font-size:12.5px;background:var(--surface);border:1px solid var(--bdr2);color:var(--tx2);white-space:nowrap}
.ver{display:inline-flex;padding:1px 7px;border-radius:7px;font-size:12px;font-weight:600;background:var(--primary-soft);color:var(--primary-d);vertical-align:middle}
/* каталог */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 8px}
.search{flex:1 1 200px;min-width:0}
.search input{width:100%;min-height:46px;padding:10px 14px;border:1.5px solid var(--bdr2);border-radius:12px;background:var(--surface);outline:none}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
select.sel{min-height:46px;padding:8px 10px;border:1.5px solid var(--bdr2);border-radius:12px;background:var(--surface);font-size:15px}
.seg{display:inline-flex;background:var(--bg2);border-radius:12px;padding:3px}
.seg button{border:none;background:none;padding:7px 12px;border-radius:9px;font-size:14px;min-height:40px;color:var(--tx2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:500}
.qchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.qchips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--bdr2);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:38px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip .n{opacity:.7;font-size:12.5px;margin-left:3px}
.active{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.achip{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary-d);border:none;border-radius:999px;padding:5px 12px;font-size:14px;min-height:34px}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:600px) and (max-width:1099px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rc{display:flex;flex-direction:column;text-align:left;width:100%;background:var(--surface);border:2px solid transparent;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;padding:0}
.rc.sel{border-color:var(--primary)}
.rc .top{display:flex;gap:12px;padding:12px 12px 8px}
.rc .ph{width:64px;height:64px;border-radius:12px;flex-shrink:0;background:var(--primary-soft);overflow:hidden}
.rc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.rc .nm{font-family:'Tenor Sans',sans-serif;font-size:18px;line-height:1.2}
.rc .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.rc .ings{padding:0 12px 10px;display:flex;flex-direction:column;gap:4px}
.mini{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13.5px}
.mini .b{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden;margin-top:2px}
.mini .b i{display:block;height:100%;background:var(--primary)}
.mini .p{text-align:right;color:var(--tx2);font-variant-numeric:tabular-nums}
.rc .foot{display:flex;gap:10px;padding:8px 12px;border-top:1px solid var(--bdr);font-size:13px;color:var(--muted);background:#FBFAF8}
.rc .foot .w{color:var(--err)}
.fav{color:#B5473A}
.lst{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.lr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bdr);width:100%;text-align:left;border-left:3px solid transparent;border-top:none;border-right:none;background:none}
.lr.sel{border-left-color:var(--primary);background:#F7F8F6}
.lr .nm{font-size:15.5px;font-weight:500}
.lr .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .r{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
/* филтри */
.fs{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
.fs h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:10px 0 6px}
.fs h4:first-child{margin-top:0}
.fs .chips{display:flex;gap:6px;flex-wrap:wrap}
/* детайл */
.dh{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-top:14px}
.dh h2{font-size:27px;line-height:1.15;margin:4px 0 6px}
.dh .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dh .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.hero .img{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--primary-soft);max-height:240px}
.hero .img img{width:100%;height:100%;object-fit:cover;display:block}
@media(min-width:760px){.hero.has{grid-template-columns:220px minmax(0,1fr)}.hero .img{max-height:none}}
/* състав — най-четимото място */
.comp{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-top:12px}
.comp h3{font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.comp h3 .r{margin-left:auto;font-family:'Jost',sans-serif;font-size:14px}
.sum{font-weight:600}
.sum.ok{color:var(--ok)}.sum.bad{color:var(--err)}
.batch{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0 6px;padding:10px;background:var(--bg);border-radius:12px}
.batch label{font-size:14px;color:var(--tx2);margin-right:2px}
.batch input{width:110px;min-height:44px;padding:8px 10px;border:1.5px solid var(--bdr2);border-radius:10px;font-size:18px;font-weight:500;text-align:right;background:var(--surface)}
.batch button{border:1.5px solid var(--bdr2);background:var(--surface);border-radius:999px;padding:6px 11px;min-height:38px;font-size:14px}
.batch button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.ing{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 10px;align-items:center;padding:11px 0;border-top:1px solid var(--bdr)}
.ing.g{grid-template-columns:minmax(0,1fr) 58px 84px}
.ing:first-of-type{border-top:none}
.ing .n{font-size:17px;line-height:1.25;min-width:0}
.ing .n button{border:none;background:none;padding:0;font-size:17px;text-align:left;color:var(--text);text-decoration:underline;text-decoration-color:var(--bdr2);text-underline-offset:3px}
.ing .n small{display:block;font-size:12.5px;color:var(--muted)}
.ing .n small.no{color:var(--err)}
.ing .p{text-align:right;font-size:17px;font-variant-numeric:tabular-nums;color:var(--tx2)}
.ing .gv{text-align:right;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.ing .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--bg2);overflow:hidden}
.ing .bar i{display:block;height:100%;background:var(--primary)}
.ing .bar i.no{background:var(--err)}
.tot{display:grid;grid-template-columns:minmax(0,1fr) 58px 84px;gap:10px;padding:10px 0 0;border-top:2px solid var(--bdr2);font-weight:600}
.tot span{text-align:right}
.tot span:first-child{text-align:left}
.sec{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);margin-top:12px;overflow:hidden}
.sec>button.shd{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;padding:14px 16px;text-align:left;min-height:54px}
.sec>button.shd b{font-family:'Tenor Sans',sans-serif;font-weight:400;font-size:18px}
.sec>button.shd span{margin-left:auto;font-size:13.5px;color:var(--muted)}
.sec>button.shd i{font-style:normal;color:var(--muted);transition:transform .15s}
.sec.open>button.shd i{transform:rotate(180deg)}
.sec .bd{display:none;padding:0 16px 14px}
.sec.open .bd{display:block}
@media(min-width:1100px){.secs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}.secs .sec{margin-top:12px}}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.kv div small{display:block;font-size:12.5px;color:var(--muted)}
.kv div b{font-weight:500;font-size:15.5px}
.li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:none;background:none;border-top:1px solid var(--bdr);padding:9px 0}
.li:first-child{border-top:none}
.li img,.li .ph{width:52px;height:52px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--primary-soft)}
.li .t{font-size:15px;font-weight:500}
.li .s{font-size:13px;color:var(--muted)}
.li .go{margin-left:auto;color:var(--muted)}
.stars{color:#B98A2E;letter-spacing:1px}
.vrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bdr);width:100%;text-align:left;border-left:none;border-right:none;border-bottom:none;background:none}
.vrow:first-child{border-top:none}
.vrow .vb{width:38px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--primary-soft);color:var(--primary-d);flex-shrink:0}
.vrow.cur .vb{background:var(--primary);color:#fff}
.diff{font-size:13px;margin-top:2px}
.diff .up{color:var(--ok)}.diff .dn{color:var(--err)}
.notes{font-size:15.5px;line-height:1.6;white-space:pre-wrap;color:var(--tx2)}
.morebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
/* работен режим */
.work{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.work .top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bdr);background:var(--surface)}
.work .top b{flex:1;font-family:'Tenor Sans',sans-serif;font-weight:400;font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.work .body{flex:1;overflow:auto;padding:12px 16px 24px;max-width:720px;width:100%;margin:0 auto}
.wi{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 12px;margin-top:8px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;text-align:left;border:2px solid transparent}
.wi .ck{width:36px;height:36px;border-radius:50%;border:2px solid var(--bdr2);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.wi.done{opacity:.55}
.wi.done .ck{background:var(--ok);border-color:var(--ok)}
.wi.next{border-color:var(--primary)}
.wi .n{font-size:20px;line-height:1.2}
.wi .n small{display:block;font-size:13.5px;color:var(--muted)}
.wi .g{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.wi .g small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
/* формуляр */
.sh-bg{position:fixed;inset:0;background:rgba(30,32,33,.35);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:680px;max-height:94vh;display:flex;flex-direction:column;border-radius:20px 20px 0 0}
@media(min-width:700px){.sh-bg{align-items:center}.sh{border-radius:20px}}
.sh .hd{display:flex;align-items:center;gap:8px;padding:16px 16px 8px}
.sh .hd h2{font-size:22px;flex:1}
.sh .bd{overflow:auto;padding:0 16px 16px;flex:1}
.sh .ft{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--bdr);background:var(--bg);border-radius:0 0 20px 20px}
.sh .ft .btn{flex:1}
.ftabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg2);border-radius:12px;padding:4px;margin:4px 0 12px}
.ftabs button{border:none;background:none;border-radius:9px;min-height:44px;font-size:14.5px;color:var(--tx2);line-height:1.2}
.ftabs button small{display:block;font-size:11.5px;color:var(--muted)}
.ftabs button.on{background:var(--surface);color:var(--text);font-weight:500;box-shadow:var(--shadow)}
.ftabs button.err{color:var(--err)}
.f{margin-top:12px}
.f label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--bdr2);border-radius:12px;background:var(--surface)}
.f textarea{min-height:110px;resize:vertical}
.f .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.f .err{font-size:13px;color:var(--err);margin-top:4px}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{border:1.5px solid var(--bdr2);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:40px;font-size:14px}
.pick button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 92px 40px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bdr)}
.erow:first-child{border-top:none}
.erow .m{border:1.5px solid var(--bdr2);background:var(--surface);border-radius:12px;min-height:48px;padding:6px 10px;text-align:left;font-size:15.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .m small{display:block;font-size:12px;color:var(--muted)}
.erow input{min-height:48px;border:1.5px solid var(--bdr2);border-radius:12px;padding:6px 10px;text-align:right;font-size:18px;width:100%;background:var(--surface)}
.erow .x{border:none;background:none;font-size:22px;color:var(--muted);min-height:44px}
.erow .mv{display:flex;flex-direction:column}
.sumbar{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0}
.sumbar .track{height:10px;border-radius:5px;background:var(--bg2);overflow:hidden;display:flex}
.sumbar .track i{display:block;height:100%}
.sumbar .lbl{display:flex;justify-content:space-between;font-size:14px;margin-top:4px}
.msearch{margin-top:10px}
.mres{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);margin-top:6px;max-height:260px;overflow:auto}
.mres button{display:flex;gap:8px;width:100%;border:none;border-bottom:1px solid var(--bdr);background:none;text-align:left;padding:10px 12px;min-height:46px;align-items:center}
.mres button small{margin-left:auto;font-size:12.5px;color:var(--muted)}
.lock{font-size:14px;color:var(--tx2);background:var(--bg);border-radius:10px;padding:12px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:90;max-width:calc(100% - 24px);text-align:center}
.fbtn{display:none}
@media(max-width:1099px){.fbtn{display:inline-flex}.fside{display:none}}
</style>
</head>
<body>
<div class="proto"><div class="in">
  <b>Прототип · Рецепти v0</b>
  <select aria-label="Пример" onchange="if(this.value)openRec(this.value);this.value=''">
    <option value="">Пример…</option>
    <option value="r1">Проста — Чиста пепел</option>
    <option value="r5">С повече съставки — Гланц ^6</option>
    <option value="r2b">Вариант — Класическа пепелна v2</option>
    <option value="r3">Със свързани тестове — Иглолистна</option>
  </select>
  <button class="btn sm" onclick="resetDemo()">Нулирай</button>
</div></div>
<div class="page"><div class="wrap list" id="wrap">
  <section class="col-list" id="colList"></section>
  <section class="col-det" id="colDet"></section>
</div></div>
<div id="layer"></div>
<script>
'use strict';
// ── речници (като в Глина) ──
var TYPES={ash:'Пепелна',matte:'Матова',gloss:'Гланцова',crystal:'Кристална',shino:'Shino',celadon:'Celadon',tenmoku:'Tenmoku',other:'Друго'};
var CONES=[['06','Конус 06 (~999°C)'],['04','Конус 04 (~1060°C)'],['6','Конус 6 (~1222°C)'],['8','Конус 8 (~1252°C)'],['10','Конус 10 (~1285°C)']];

// ── помощни ──
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function rec(id){return D.recipes.find(function(r){return r.id===id;});}
function mat(id){return MATS.find(function(m){return m.id===id;});}
function lin(r){return r.lineageId||r.id;}
function vers(r){return D.recipes.filter(function(x){return lin(x)===lin(r);}).sort(function(a,b){return (a.version||1)-(b.version||1);});}
function latest(r){var v=vers(r);return v[v.length-1].id===r.id;}
function vlabel(r){return vers(r).length>1?'v'+(r.version||1):'';}
function dname(r){return r.name+(vlabel(r)?' '+vlabel(r):'');}
function sum(r){return r.ingredients.reduce(function(a,i){return a+(parseFloat(i.pct)||0);},0);}
function testsOf(r){return D.tests.filter(function(t){return t.recipeId===r.id;});}
function piecesOf(r){return D.pieces.filter(function(p){return p.recipe===r.id;});}
function photoOf(r){if(r.photo)return r.photo;var t=testsOf(r).find(function(t){return t.photo;});return t?t.photo:null;}
function have(i){return i.matId&&i.matId!=='__c'&&!!mat(i.matId);}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove();},2200);}
function fmt(n){return (Math.round(n*10)/10).toString().replace('.',',');}
function stars(n){return '<span class="stars">'+'★★★★★'.slice(0,n)+'</span><span style="color:var(--bdr2)">'+'★★★★★'.slice(n)+'</span>';}
function tempBand(r){var t=parseFloat(r.temp);if(!t)return '';return t<1200?'lt':t<=1240?'mid':'gt';}

function matches(r){
  if(!S.allver&&!latest(r))return false;
  if(S.fav&&!r.fav)return false;
  if(S.types.length&&S.types.indexOf(r.glazeType)<0)return false;
  if(S.temp&&tempBand(r)!==S.temp)return false;
  if(S.cones.length&&S.cones.indexOf(r.cone)<0)return false;
  if(S.tests==='with'&&!testsOf(r).length)return false;
  if(S.tests==='without'&&testsOf(r).length)return false;
  if(S.ing.length&&!S.ing.every(function(n){return r.ingredients.some(function(i){return i.name===n;});}))return false;
  if(S.q){var q=S.q.toLowerCase(),h=[r.name,r.notes,TYPES[r.glazeType],r.temp].concat(r.ingredients.map(function(i){return i.name;})).join(' ').toLowerCase();if(h.indexOf(q)<0)return false;}
  return true;
}
function activeChips(){

  S.cones.forEach(function(v){a.push(['cones',v,'Конус '+v]);});
  if(S.fav)a.push(['fav','','♥ Любими']);
  if(S.tests)a.push(['tests','',S.tests==='with'?'С тестове':'Без тестове']);
  S.ing.forEach(function(v){a.push(['ing',v,'съдържа '+v]);});
  if(S.allver)a.push(['allver','','Всички версии']);
  return a;
}

  F.err={};

  var valid=F.ings.filter(function(i){return i.name&&i.pct;});
  var bad=valid.find(function(i){return !(parseFloat(i.pct)>0);});
  var seen={},dupI=valid.find(function(i){if(i.matId&&i.matId!=='__c'){if(seen[i.matId])return true;seen[i.matId]=1;}return false;});

  if(F.verOf){var base=rec(F.verOf);var nv=mkVer(base,data,'');closeSheet();openRec(nv.id);toast('Създадена версия v'+nv.version);return;}
  if(F.id){
    var old=rec(F.id),changed=JSON.stringify(old.ingredients.map(function(i){return i.name+'|'+i.pct;}).sort())!==JSON.stringify(data.ingredients.map(function(i){return i.name+'|'+i.pct;}).sort());
    if(changed&&testsOf(old).length){versionAsk(old,data);return;}
    Object.assign(old,data);closeSheet();go();toast('Обновено');return;
  }
  var r=Object.assign({id:'r'+Date.now(),fav:false},data);D.recipes.push(r);closeSheet();openRec(r.id);toast('Добавено!');
}
function mkVer(base,data,note){
  var vs=vers(base),max=vs.reduce(function(m,x){return Math.max(m,x.version||1);},0);
  vs.forEach(function(x){x.lineageId=lin(base);x.version=x.version||1;});
  var nv=Object.assign({id:'r'+Date.now(),lineageId:lin(base),version:max+1,fav:false},data);if(note)nv.versionNote=note;D.recipes.push(nv);return nv;
}
// Пазачът от Глина v1.10.0: съставът се сменя, а към рецептата сочат тестове.
function versionAsk(old,data){
  var n=testsOf(old).length,nx=vers(old).reduce(function(m,x){return Math.max(m,x.version||1);},0)+1;
  document.getElementById('layer').innerHTML+='<div class="sh-bg" style="z-index:65"><div class="sh"><div class="hd"><h2>Съставът се променя</h2></div><div class="bd"><div style="font-size:15.5px;line-height:1.55">'+n+(n===1?' тест сочи':' теста сочат')+' към тази рецепта и описва'+(n===1?'':'т')+' сегашния ѝ състав.</div>'
    +'<button class="btn pri" style="width:100%;margin-top:14px;flex-direction:column;align-items:flex-start;text-align:left" onclick="vAns(true)">Запази като нова версия v'+nx+'<span style="font-weight:400;font-size:13.5px;opacity:.9">тестовете остават при v'+(old.version||1)+'</span></button>'
    +'<button class="btn" style="width:100%;margin-top:8px;flex-direction:column;align-items:flex-start;text-align:left" onclick="vAns(false)">Запази върху сегашната<span style="font-weight:400;font-size:13.5px;color:var(--muted)">тестовете ще описват състав, който вече го няма</span></button>'
    +'<button class="btn ghost" style="width:100%;margin-top:4px" onclick="this.closest(\'.sh-bg\').remove()">Назад към формуляра</button></div></div></div>';
  window._va={old:old,data:data};
}
function vAns(asNew){var o=window._va.old,d=window._va.data;if(asNew){var nv=mkVer(o,d,'');closeSheet();openRec(nv.id);toast('Създадена версия v'+nv.version);}else{Object.assign(o,d);closeSheet();go();toast('Обновено');}}
function newVer(id){var r=rec(id);editRec(null,r,id);}
function dup(id){var r=rec(id),c=JSON.parse(JSON.stringify(r));c.id='r'+Date.now();c.name=r.name+' (копие)';c.fav=false;delete c.lineageId;delete c.version;delete c.versionNote;c.upd=new Date().toISOString().slice(0,10);D.recipes.push(c);openRec(c.id);toast('Дублирано');}
function del(id){var r=rec(id),nt=testsOf(r).length,np=piecesOf(r).length;if(!confirm('Изтрий рецептата?'+(nt||np?'\n\nСвързани записи ще останат без рецепта:'+(nt?'\n• '+nt+' теста':'')+(np?'\n• '+np+' изделия':'')+'\n(Те НЕ се изтриват.)':'')))return;D.recipes=D.recipes.filter(function(x){return x.id!==id;});S.id=null;go();toast('Изтрито');}
function favT(){var r=rec(S.id);r.fav=!r.fav;go();toast(r.fav?'Добавено в любими':'Премахнато от любими');}
// ── навигация ──
function tog(k,v){var a=S[k],i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);go();}
function togI(n){tog('ing',n);}
function unset(k,v){if(k==='types'||k==='cones'||k==='ing')S[k]=S[k].filter(function(x){return x!==v;});else if(k==='temp'||k==='tests')S[k]='';else S[k]=false;go();}
function clearF(){S.types=[];S.temp='';S.cones=[];S.fav=false;S.tests='';S.ing=[];S.allver=false;S.q='';go();}
function openRec(id){S.id=id;S.open={};go();if(window.innerWidth<1100)window.scrollTo(0,0);}
function closeRec(){S.id=null;go();}
function resetDemo(){D=seed();S={id:null,view:'cards',q:'',types:[],temp:'',cones:[],fav:false,tests:'',ing:[],allver:false,sort:'upd',open:{},batch:'',filters:false};closeSheet();go();toast('Демото е нулирано');}
function go(){
  if(!S.id&&window.innerWidth>=1100)S.id='r3';
  document.getElementById('wrap').className='wrap '+(S.id?'det':'list');
  document.getElementById('colList').innerHTML=listHtml();
  document.getElementById('colDet').innerHTML=detHtml(S.id?rec(S.id):null);
}
function goKeep(){var q=document.getElementById('q'),pos=q.selectionStart;document.getElementById('colList').innerHTML=listHtml();q=document.getElementById('q');q.focus();try{q.setSelectionRange(pos,pos);}catch(e){}}
window.addEventListener('keydown',function(e){if(e.key==='Escape'){if(document.querySelector('.work'))closeWork();else if(document.querySelector('.sh-bg'))closeSheet();}});
go();
</script>
</body>
</html>
