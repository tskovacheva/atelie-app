.placemain select,.placemain input{font-size:13px;padding:5px 7px}
.matched{color:var(--indigo)}

/* What a plant can give, in the list. For someone who dyes this is the most
   important column on the screen, so it sits second — right after the name. */
.swatchrow{display:inline-flex;gap:4px;align-items:center}
/* Deliberately squarer than everything else. A 26px chip at a large radius
   loses about a fifth of its visible area to the corners, and the sample is the
   one thing on screen whose area must not be distorted. */
.miniswatch{
  width:26px;height:26px;border-radius:3px;display:inline-block;
  border:1px solid rgba(0,0,0,.12);flex:none;
}
td.swatchcell,th.swatchcell{white-space:nowrap;width:1%}
@media (max-width:640px){.miniswatch{width:20px;height:20px}}

/* The name cell carries the botanical name as a subline rather than as a
   column of its own — identity is one block, not two (§13i). */
.namecell{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.latinline{color:var(--muted);font-size:12.5px}

/* Availability is a filter, not a standing column: it answers a sourcing
   question, and the list is for choosing. */
.chiprow{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:-6px 0 14px}
.chiplabel{color:var(--muted);font-size:12.5px;margin-right:2px}
.box.small{padding:5px 10px}
.box.small .boxcount{font-size:12px;font-weight:500}

/* The profile is one column, because the order is the meaning. Blocks may hold
   two columns inside themselves on a wide screen; the page never does. */
.readblocks{display:flex;flex-direction:column;gap:0}
.sub{margin-top:15px;min-width:0}
/* A profile section shares its class name with the page subtitle (line ~119)
   and inherited its measure: a block of swatch cards was held to 74ch and the
   rest of the panel stood empty (UX package 2). The measure belongs to the
   prose INSIDE a section, which keeps its own `.prose` limit. */
section.sub{max-width:none}
.sub h3{
  font-size:var(--h-sub);font-weight:600;color:var(--ink);
  letter-spacing:0;text-transform:none;margin:0 0 5px;
}
.subone{min-width:0}
.subcols{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-items:start}
@media (max-width:900px){.subcols{grid-template-columns:1fr}}
/* One section alone takes the row, instead of half of it beside an empty half. */
.subcols > .sub:only-child{grid-column:1/-1}

/* NARRATIVE ACROSS THE PAGE, above 1100px (§13di).
   The way to use a wide screen for prose is not a longer line — it is a second
   column of SECTIONS. „Багрилни качества" and „Багрилна съставка" are separate
   pieces of writing, so they can sit side by side without either of them
   growing past the measure, and the page stops being a strip with four hundred
   empty pixels beside it.
   Sections, never paragraphs: splitting one passage into columns would make it
   read bottom-left to top-right, which is a newspaper trick and wrong for a
   reference. */
@media (min-width:1100px){
  /* A grid, not `column-count`: the multicol balancer left two unbreakable
     sections stacked in the left column with the right one empty (UX package 2).
     Sections still read left to right, then down; one alone takes the row. */
  .subone{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;align-items:start}
  .subone > .sub:only-child{grid-column:1/-1}
}

/* How much of something there is (§13bh). Indigo rather than a heat ramp from
   green to red: a coloured scale beside a photograph of dyed cloth is a second
   opinion about colour, and this screen must not have one. */
/* An icon before a figure. Sized down from the sprite's 18px because it sits on
   a line of text and must not out-weigh the number it introduces. */
.cond,.typecell{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.stagecardhead>svg,.prepcardhead>svg{width:16px;height:16px;color:var(--muted);flex:none}
.procrow svg,.procrow summary>svg{width:15px;height:15px;color:var(--muted);flex:none}
.factlabel{display:inline-flex;align-items:center;gap:5px}
.factlabel svg{width:13px;height:13px;flex:none}
.conds{display:inline-flex;flex-wrap:wrap;gap:4px 14px}
.cond svg,.typecell svg{width:14px;height:14px;color:var(--muted);flex:none}
.conditions{display:flex;flex-wrap:wrap;gap:6px 18px}

/* The figures you need standing over a pot (§13bs). Tiles, not a fact grid:
   these are instruments to be read at a glance and a two-column list of
   label-and-value scans as prose. The order is the order of use. */
.usenow{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
  gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;
  overflow:hidden;margin-bottom:14px;
}
/* `min-width:0` is the whole of the overflow fix. A grid item's minimum width
   is `auto`, which means its own content — so a tile whose value was wider than
   the track pushed the track out with it, the row grew past the viewport, and
   the strip was clipped rather than scrollable (337px of content in 322px). The
   track was never the problem: 108px is legible and stays.

   A long value now takes a second line instead of a wider tile. What it must
   not do is take a smaller typeface or a horizontal scroll: these are the
   figures somebody reads at a glance standing over a pot (§13bs). */
.usetile{display:flex;flex-direction:column;gap:3px;padding:11px 13px;background:var(--surface);min-width:0}
/* The label was a bare text node in a flex row, which makes it an ANONYMOUS
   flex item — and an anonymous item's `min-width:auto` cannot be reached by any
   selector. So it could not shrink below its longest word, and one Bulgarian
   compound („Светлоустойчивост", 163px in a 121px tile) pushed the whole strip
   past the viewport. That is why `min-width:0` on the tile changed nothing: the
   tile was never the item that refused to shrink.

   Wrapped in a span it is a real item, and can be told to wrap. `hyphens:auto`
   first so a break lands where the language allows one; `break-word` is the
   last resort for a word with nowhere good to break. The mark still accompanies
   the label and does not replace it (§13ac). */
.usehead{display:flex;align-items:flex-start;gap:5px;font-size:11.5px;color:var(--muted);
  letter-spacing:.04em;text-transform:uppercase;min-width:0}
.usehead svg{width:14px;height:14px;flex:none;margin-top:1px}
.uselabel{min-width:0;overflow-wrap:break-word;hyphens:auto}
/* Strong and scannable, and allowed to wrap. `overflow-wrap:break-word` is the
   last resort for a single word longer than the tile — a wrapped word is worse
   than a short line and better than a clipped one. Figures never reach it: they
   are joined with non-breaking spaces at the point they are built, so `80–90 °C`
   and `1 : 20` stay whole and wrap around themselves, not through themselves. */
.useval{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
  overflow-wrap:break-word;min-width:0}
.usetile .hint{font-size:11.5px}
@media (max-width:640px){
  .usenow{grid-template-columns:repeat(auto-fit,minmax(108px,1fr))}
  .useval{font-size:14px}
}

.chemline{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:2px 0}
.level{display:inline-flex;align-items:center;gap:8px}
.levelbar{display:inline-flex;gap:3px}
.levelbar .seg{width:11px;height:5px;border-radius:2px;background:var(--line)}
.levelbar .seg.on{background:var(--indigo)}
.levelword{font-size:12.5px;color:var(--muted)}

.colourcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:9px}
.colourcards .refcard{margin-bottom:0}

/* Safety. Jaundice-yellow for care and madder for heightened care; low risk is
   neutral rather than green. The colour renders the code — it never carries the
   meaning alone, so the label is always beside it. */
.risk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.riskdot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--line);
  border:1px solid rgba(0,0,0,.15)}
.risk.low{color:var(--muted)}
.risk.caution{color:#8a6f14}
.risk.caution .riskdot{background:var(--weld)}
.risk.elevated{color:var(--madder)}
.risk.elevated .riskdot{background:var(--madder)}
#flash{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
  background:var(--indigo);color:#fff;padding:9px 18px;border-radius:999px;
  font-size:13.5px;box-shadow:0 6px 20px rgba(42,39,36,.22);
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:60;
}
#flash.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){#flash{bottom:76px}}

/* A menu of screens: icon, name, one line on when to use it, chevron. Better
   than a grid of bare labels — the sentence was already written and only showed
   after you had already chosen. */
.searchbox{
  display:flex;align-items:center;gap:8px;flex:1;min-width:180px;max-width:340px;
  border:1px solid var(--line);border-radius:999px;padding:0 12px;background:var(--surface);
}
.searchbox:focus-within{border-color:var(--indigo)}
.searchbox svg{color:var(--muted);flex:none}
.searchbox input{border:0;background:none;padding:8px 0;flex:1;min-width:0;font-size:13.5px}
.searchbox input:focus{outline:none}
.searchbox input::-webkit-search-cancel-button{display:none}
.searchclear{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 2px}

.picker{display:block;min-width:0}
.picker input[type="text"]{width:100%}

/* A filter box with its mark. The mark sits above the word, never instead of
   it — sixteen pictures nobody has seen before are sixteen guesses. */
/* The same mark beside a state wherever it is named. */
.chip.withmark{display:inline-flex;align-items:center;gap:5px}
.chip.withmark svg{width:14px;height:14px;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

.box .boxicon{display:block;margin-bottom:5px}
.box .boxicon svg{width:21px;height:21px;stroke:var(--muted);fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.box.active .boxicon svg{stroke:var(--indigo)}

.pickgroup{margin-bottom:18px}
.picklist{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.pickrow{
  display:grid;grid-template-columns:30px 1fr 14px;gap:13px;align-items:center;
  width:100%;text-align:left;padding:13px 14px;cursor:pointer;
  background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;
}
.picklist .pickrow:last-child{border-bottom:0}
.pickrow:hover{background:var(--ground)}
.pickrow:focus-visible{outline:2px solid var(--indigo);outline-offset:-2px}
.pickrow svg{width:23px;height:23px;stroke:var(--indigo);fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.pickname{display:flex;flex-direction:column;gap:2px;min-width:0}
.pickname b{font-size:14px;font-weight:600}
.pickname span{font-size:12.5px;color:var(--muted);line-height:1.35}
.pickgo{color:var(--line);font-size:17px;text-align:right}

.riskmarks{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}

/* One bath, several pieces (§13bd). A separate row from `.pickrow`, which is a
   three-column list of destinations; this one carries a tick, a tag number, a
   name, a weight and the box the piece is in, and the weight column has to line
   up down the list because the running total below is their sum. */
.batchlist{border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:var(--surface);list-style:none;padding:0;margin:0}
.batchrow{
  display:grid;grid-template-columns:30px 56px 1fr 78px auto;gap:12px;
  align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);
}
.batchlist .batchrow:last-child{border-bottom:0}
.batchrow.on{background:color-mix(in srgb, var(--indigo) 5%, transparent)}
.batchname{display:flex;flex-direction:column;gap:2px;min-width:0}
.batchname b{font-size:14px;font-weight:600}
.batchname .hint{font-size:12.5px}
.batchstate{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}

/* A treatment that did not move the piece between boxes. Quieter than a chip on
   purpose: the box is where the cloth IS, the tag is what it has been through,
   and reading them as equals would put tannin and mordanted on one footing. */
.tag{
  display:inline-block;padding:2px 7px;border-radius:5px;font-size:11.5px;
  color:var(--muted);background:var(--ground);border:1px solid var(--line);
}

/* The number the recipe is scaled against, and it must not leave the screen
   while the list is scrolled: it is the one figure on this page that everything
   weighed out depends on. */
.runningtotal{
  position:sticky;bottom:0;display:flex;justify-content:space-between;
  align-items:center;gap:14px;margin-top:12px;padding:12px 15px;
  border:1px solid var(--line);border-radius:8px;background:var(--surface);
  color:var(--muted);font-size:13px;
}
.runningtotal.on{border-color:var(--madder);color:var(--ink)}
.runningtotal .num{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}

.summaryline{
  margin:18px 0 12px;padding-top:14px;border-top:1px solid var(--line);
  font-size:15px;
}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.scaledbox{margin:6px 0 14px;padding:12px 15px;border:1px solid var(--line);
  border-radius:8px;background:var(--ground)}
.scaledbox .qty{list-style:none;padding:0;margin:8px 0 0}
.scaledbox .qty li{display:flex;justify-content:space-between;gap:14px;
  padding:4px 0;font-size:13.5px}
.scaledbox .qty .num{font-variant-numeric:tabular-nums}
.chainsteps{margin:6px 0 14px;padding-left:20px}
.chainsteps .qty{list-style:none;padding:0;margin:5px 0 10px}
.chainsteps .qty li{display:flex;justify-content:space-between;gap:14px;
  padding:3px 0;font-size:13px;color:var(--muted)}
/* A flat box: still a control, still a finger target, but without the count and
   the icon a shelf filter carries. `.chip` was wrong here and check.sh said so —
   a chip names and a box is pressed (§13ac), and every one of these changes the
   screen when pressed. */
/* The preparation the cloth carries, read on the trial. Quieter than a step
   row, because these are not steps of this work — they happened to the cloth
   and this work inherited them. */
.prepcardhead{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.prepcardhead b{font-size:14px}
.prepcardhead .spacer{flex:1}
/* What the cloth has been through, read from the cloth (§13bd). Columns rather
   than a run of spans: the action, then when, then what with. Set as a grid so
   the dates line up down the list — three lines of prose with dots between them
   is what this was, and it read as one sentence broken in the wrong places. */
.preplist{list-style:none;margin:0;padding:0}
.prepline{
  display:grid;grid-template-columns:16px minmax(120px,auto) 92px 1fr;
  gap:10px;align-items:baseline;
  padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px;
}
.preplist .prepline:last-child{border-bottom:0}
.prepline>svg{width:15px;height:15px;color:var(--muted);align-self:center}
.prepwhat{font-weight:600}
.prepwhen{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.prepwith{color:var(--muted);font-size:12.5px;min-width:0}
.prepshared{color:var(--muted);font-size:12.5px}
.prepwith .prepshared::before{content:' · '}

/* A shot from earlier work on the same cloth (§13bn). Set back rather than
   hidden: it belongs to the piece's story and not to this record, and the eye
   should be able to find where one work ends and the next begins without
   reading a caption. */
.lifeshot.earlier img{opacity:.72}
.lifeshot.earlier{position:relative}
.lifeshot.earlier::after{
  content:'';position:absolute;left:-7px;top:0;bottom:0;
  border-left:1px dashed var(--line);
}
.lifeshot.earlier+.lifeshot:not(.earlier)::before{
  content:'';position:absolute;left:-7px;top:0;bottom:0;
  border-left:1px solid var(--line);
}
.lifeshot:not(.earlier){position:relative}
.shotfrom{display:block;font-size:11.5px;color:var(--muted);font-style:italic}

/* The four levels of action (§13bo). `contextual` is the one that was missing:
   "add a role", "add a step" — an action INSIDE a list, which wore the same
   weight as the second action of the whole screen. Lighter, and it carries its
   plus so it reads as an addition rather than as a choice. */
.btn.contextual{font-size:12.5px;padding:6px 10px;color:var(--muted)}
.btn.contextual:hover{color:var(--ink)}
.btn svg{width:15px;height:15px;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px}

/* The way up: the module's own name, not the word "back". */
.btn.upto{padding-left:6px;color:var(--muted)}
.btn.upto:hover{color:var(--indigo)}
.btn.upto svg{width:16px;height:16px}
.prepline:hover .prepwhat{color:var(--indigo)}
@media (max-width:640px){
  .prepline{grid-template-columns:16px 1fr;gap:4px 10px}
  .prepwhen,.prepwith{grid-column:2}
}
/* A line in the work form carries a tick first: which preparation this work
   used (rc95). One more column, on these lines only. */
.prepline.picks{grid-template-columns:22px 16px minmax(120px,auto) 92px 1fr}
.preppick{display:flex;align-items:center;cursor:pointer}
.prepfabric + .prepfabric{margin-top:10px}
@media (max-width:640px){
  .prepline.picks{grid-template-columns:22px 16px 1fr}
  .prepline.picks .prepwhen,.prepline.picks .prepwith{grid-column:3}
}

/* What a piece carries, on the row where work is chosen. */
.carries{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:3px}

.boxes.flat{gap:6px}
.box.flat{flex-direction:row;padding:9px 13px;min-height:38px}
.box.flat .boxname{font-size:13px}

@media (max-width:640px){
  .batchrow{grid-template-columns:30px 1fr auto;gap:8px 10px}
  .batchrow .mono{grid-column:2}
  .batchname{grid-column:2/4}
  .batchstate{grid-column:2/4;justify-content:flex-start}
  .cols2{grid-template-columns:1fr}
}

.sourcenote{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  color:var(--muted);font-size:12.5px;line-height:1.5;
}
.sourcelabel{font-weight:600}
/* A URL has no spaces, so it sets the minimum width of everything above it. One
   sciencedirect link in a plant's Sources block made the page 459px wide in a
   390px window, and the bottom bar — which is the width of the page, not the
   window — carried its last button, "Още", off the right edge. The record read
   perfectly well; the navigation had gone. Applies to every link, because the
   next long address will not be in a plant. */
a,.sourcenote{overflow-wrap:anywhere}

/* A piece's whole life in pictures, in the order it happened (§8.0c). Scrolls
   sideways rather than wrapping: the sequence is the point, and a grid that
   reflows breaks the reading of it. */
/* It scrolls sideways because the sequence is the point. But a strip that
   scrolls with nothing to say so is a strip that ends at the fifth photograph
   as far as the reader is concerned — reported by the owner, who could not see
   the last one (§13as). The bar is always shown rather than on hover, and the
   right edge fades while there is more to come. */
.lifestrip{
  display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  scroll-snap-type:x proximity;
  mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);
}
.lifestrip::-webkit-scrollbar{height:8px}
.lifestrip::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.lifeshot{margin:0;flex:none;width:132px;scroll-snap-align:start}
.lifeshot img{
  width:132px;height:132px;object-fit:cover;display:block;
  border-radius:6px;border:1px solid var(--line);
}
.lifeshot figcaption{display:flex;flex-direction:column;gap:1px;margin-top:5px;font-size:12px}
.lifeshot figcaption .hint{font-size:11px}

/* The progress line. Generated from the steps that exist, so a stage worked
   twice appears twice — the line shows the work, not a template. */
.stageline{
  display:flex;align-items:center;flex-wrap:wrap;gap:4px;
  padding:10px 12px;margin-bottom:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
}
.stagemark{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);white-space:nowrap}
.stagemark.fixed{color:var(--muted)}
.stagedot{
  display:inline-flex;align-items:center;justify-content:center;
  width:19px;height:19px;border-radius:50%;font-size:11px;
  background:var(--indigo);color:#fff;flex:none;
}
.stagemark.fixed .stagedot{background:none;border:1px dashed var(--line)}
.stagearrow{color:var(--line);font-size:15px}

.stagegroup{border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.stagehead{
  display:flex;align-items:center;gap:8px;padding:7px 11px;
  background:var(--surface);border-bottom:1px solid var(--line);font-size:14px;
}
.stagegroup .ingrow{border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0}
.stagegroup .ingrow:last-child{border-bottom:0}
.stagestarters{display:flex;flex-wrap:wrap;gap:6px}

/* Photographs on a step and on a plan. Smaller than the result grid: they are
   evidence of how the work went, glanced at rather than studied. */
.stepphotos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stepphoto{position:relative;border-radius:5px;overflow:hidden;border:1px solid var(--line);
  width:78px;height:78px;flex:none}
.stepphoto img{width:100%;height:100%;object-fit:cover;display:block}
.stepphoto .btn{position:absolute;top:1px;right:1px;background:var(--surface);padding:1px 6px;
  font-size:12px;line-height:1.3}
.stepphotos .addphoto{width:78px;height:78px;display:flex;align-items:center;justify-content:center;
  border:1px dashed var(--line);border-radius:5px;color:var(--muted);cursor:pointer;
  font-size:20px;background:none;flex:none}
.stepphotos .addphoto:hover{border-color:var(--indigo);color:var(--indigo)}

.resultphotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:10px}
.resultphotos.big{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-bottom:16px}
.resultphotos.big img{height:200px}
.resultphoto{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.resultphoto img{width:100%;height:96px;object-fit:cover;display:block}
.resultphoto .btn{position:absolute;top:2px;right:2px;background:var(--surface);padding:2px 7px}
.checks.column{flex-direction:column;gap:2px;max-height:190px;overflow:auto}

@media (max-width:700px){
  .steptimes{grid-template-columns:1fr 1fr}
  .mediumrow{grid-template-columns:1fr 1fr}
  .placemain{grid-template-columns:1fr 1fr}
  .placement{flex-direction:column}
  .placephoto{width:100%;flex:auto}
}
/* 146px was sized for a bare 19px glyph. The plate is 36px wide plus its gap,
   so the same track left the name and the count fighting for the remainder and
   they overlapped. */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:9px}
.tile{
  display:flex;align-items:center;gap:10px;
  padding:12px 13px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--ground);cursor:pointer;text-align:left;color:var(--ink);
}
.tile:hover{border-color:var(--muted)}
/* The mark sits on a tinted plate rather than bare on the ground. No new
   colour — indigo at a tenth — but it gives the glyph an edge to be drawn
   against, which is most of what reads as "finished". */
.tile svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tileplate{
  display:grid;place-items:center;flex:0 0 36px;width:36px;height:36px;
  border-radius:calc(var(--radius) - 1px);
  background:color-mix(in srgb, var(--indigo) 10%, transparent);
  color:var(--indigo);
}
.tile:hover .tileplate{background:var(--indigo);color:#fff}
.tilename{font-size:13.5px;line-height:1.25;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tilecount{
  font-size:15px;font-weight:600;color:var(--indigo);
  font-variant-numeric:tabular-nums;margin-left:auto;flex:none;padding-left:8px;
}
.tile:focus-visible{outline:2px solid var(--indigo);outline-offset:1px}

.updatebar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:10px;
  background:var(--indigo);color:#fff;
  padding:9px 10px 9px 16px;border-radius:24px;
  box-shadow:0 4px 16px rgba(42,39,36,.22);
  font-size:13.5px;z-index:200;max-width:calc(100vw - 24px);
}
.updatebar .btn{padding:5px 12px;font-size:13px}
.updatebar .btn.primary{background:var(--surface);border-color:var(--surface);color:var(--indigo)}
.updatebar .btn.quiet{color:rgba(255,255,255,.75);padding:5px 8px}
.updatebar .btn.quiet:hover{background:rgba(255,255,255,.12);color:#fff}
/* Narrow screen. Everything else that once lived in here was a duplicate of
   rules standing outside it — see §13e. */
@media (max-width:820px){
  .gap{height:16px}
  .updatebar{bottom:calc(76px + env(safe-area-inset-bottom))}
  @media (max-width:700px){
    .steptimes{grid-template-columns:1fr 1fr}
    .mediumrow{grid-template-columns:1fr 1fr}
    .placemain{grid-template-columns:1fr 1fr}
    .placement{flex-direction:column}
    .placephoto{width:100%;flex:auto}
  }
}

/* Below 640px a table stops being a table (§13ae).
   A table exists so values can be compared down a column. On a phone there is
   no column — there is one view — and the question changes with it: at a desk
   *which of these has the most tannin*, in the hand *is this the plant I am
   looking for*. The plants list was 562px wide inside a 390px window and the
   substances list 721px; scrolling sideways to reach "which part" is reading a
   table through a letterbox.

   Each row becomes a card. The first cell that has words leads it; every other
   cell carries its column heading beside it, supplied by `labelCells()` at
   render, because `attr()` cannot reach across the table to the header row.
   Nothing is dropped: the columns a phone does not need are a judgement to make
   with the lists in hand, not one to guess at here. */
@media (max-width:640px){
  .grid thead{display:none}
  .sortselect{display:flex;align-items:center;gap:6px}
  .sortselect select{min-height:44px}
  .grid,.grid tbody,.grid tr,.grid td{display:block;width:auto}
  .grid tbody tr{
    border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;margin:0 0 10px;background:var(--surface);
    position:relative;
  }
  .grid tbody tr:last-child{margin-bottom:0}
  .grid tbody tr:hover{background:var(--surface)}
  .grid td{border-bottom:0;padding:3px 0;display:flex;gap:10px;align-items:baseline}
  .grid tbody tr td:last-child{padding-bottom:0}
  .grid td[data-label]::before{
    content:attr(data-label);flex:none;width:38%;max-width:132px;
    color:var(--muted);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;
    line-height:1.5;
  }
  /* The row's own name leads, at reading size and with no label over it: a card
     headed "ИМЕ  дъб" reads as a form, not as a plant. */
  .grid td.leadcell{display:block;font-size:15.5px;font-weight:500;padding-bottom:6px}
  .grid td.leadcell::before{content:none}
  /* The star and the selection box sit in the corner of the card rather than
     taking a line of their own. They keep their 44px target (§13ac). */
  .grid td.favcell,.grid td.pick{
    position:absolute;top:6px;right:8px;width:auto;padding:0;
  }
  .grid td.favcell::before,.grid td.pick::before{content:none}
  .grid td.leadcell{padding-right:52px}
  /* A colour sample is not a value to be labelled and lined up; it is the one
     thing on this screen whose area must not be squeezed (§13n). */
  td.swatchcell{width:auto}
  .grid td.emptycell{display:none}
  /* A note runs to a paragraph, and a paragraph turns one card into a screen:
     the sources list came out 405px per row. Four lines, with the heading above
     rather than beside it, and the whole of it in the record. */
  .grid td.clip,.grid td.longcell{
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;
    overflow:hidden;max-width:none;
  }
  .grid td.clip::before,.grid td.longcell::before{width:auto;display:block}
  .grid .num{text-align:left}
  /* A value in a card wraps inside the card (§13gh). The cell is a flex row, and
     a flex item's minimum width is its content's: with `.typecell` and `.cond`
     kept on one line for the desktop table (nowrap), „бои, пасти и свързващи
     вещества" could not shrink below its full length and ran past the card.
     In a card the value takes the room beside its label and wraps there; a
     string with no break in it — a name typed as one word — breaks rather than
     widen the card. The desktop table is untouched. */
  .grid td > *{min-width:0}
  .grid td{overflow-wrap:anywhere}
  .grid td .typecell,.grid td .cond{white-space:normal;display:inline-flex;align-items:baseline}
  .grid td .typecell svg,.grid td .cond svg{align-self:center}
  /* The panel no longer holds anything wider than itself, so the sideways
     scroll put there as a stopgap in §13o is removed with the cause. */
  .panel.flush{overflow-x:visible}
  .panel.flush .grid{padding:12px}
}

/* A control is what changes the screen when it is pressed, and below 640px it
   is sized for a finger: 44px, the width of an adult fingertip. At a desk a
   19px star is a small mouse target; in a wet hand in a garden it is not a
   target at all, and this application is used in a garden.

   What is NOT here, deliberately: `.chip`. A chip is a `<span>` — the
   conditions under a reference result, a technique's category, a plant's
   precautions. It names something and does nothing when pressed, so making it
   44px tall would be sizing prose for a finger. `.box` — the role filter in
   plants, the state filter in fabrics — is a `<button>` that changes what the
   list shows, and it is the thing rule 3 (§13s) means by a chip. The two look
   alike and behave nothing alike; they are told apart here by what they do, and
   `check.sh` refuses a `.chip` that is a button or a `.box` that is not. */
@media (max-width:640px){
  /* The header actions were one unwrapping row. On the reference records tab —
     a two-tab switch beside two buttons — it ran 13px past the edge and the tab
     switch itself clipped, so "Записи" was half a word. Nobody had seen it:
     `#/reference/records` showed the search tab until §13ad gave the module an
     open(), so the address existed and the screen behind it did not. */
  .pageactions{flex-wrap:wrap}
  .tabswitch{flex:1 1 100%}
  .tabswitch .tab{flex:1}
  .btn,.tab,.box,.fav,.moreitem,.bottomnav button,
  input:not([type=checkbox]):not([type=radio]),select,textarea{
    min-height:44px;
  }
  /* Named on its own because `.box.flat{min-height:38px}` above is two classes
     and `.box` here is one: the more specific rule won at every width, and the
     action row on the batch screen stayed 40px on a phone (§13dt). Same
     specificity, later in the sheet, so this one wins. */
  .box.flat{min-height:44px}
  .btn,.tab,.box{display:inline-flex;align-items:center;justify-content:center}
  .box{align-items:center}
  /* The star is square: a 44px-tall target 22px wide is still missed. */
  .fav{min-width:44px}
  /* A checkbox cannot be stretched, so the label around it carries the target.
     Every checkbox in the application already sits in a `label.check` except
     the fabric selection box, which is the seed of the bulk actions and now has
     one of its own. */
  label:has(> input[type=checkbox]),label:has(> input[type=radio]),.pickbox{
    display:inline-flex;align-items:center;min-height:44px;
  }
  .pickbox{justify-content:center;min-width:44px}
}

.moresheet{
  position:fixed;inset:0;background:rgba(42,39,36,.4);
  display:flex;align-items:flex-end;z-index:50;
}
.morepanel{
  background:var(--surface);width:100%;
  border-top-left-radius:16px;border-top-right-radius:16px;
  padding:18px 14px calc(18px + env(safe-area-inset-bottom));
  max-height:82vh;overflow:auto;
}
.morehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.morehead h2{margin:0}
.moregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.moreitem{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:14px 6px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--ground);cursor:pointer;font-size:12px;color:var(--ink);text-align:center;
}
.moreitem svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.moreitem[aria-current="page"]{border-color:var(--indigo);color:var(--indigo)}
.morelang{display:flex;gap:6px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* A batch line that departs from the recipe it came from (§13dr). The chip
   carries the word; colour is a second signal and never the only one, because
   the palette is deliberately narrow and a reader in strong studio light
   should not have to see a tint to know what a row says. */
.dep-added   { background: var(--madder); color: #fff; }
.dep-changed { background: var(--weld);   color: var(--ink); }
.dep-swapped { background: var(--weld);   color: var(--ink); }
.dep-removed { background: var(--line);   color: var(--muted); }
/* Struck out, not hidden: „I left the soda out" is knowledge and stays legible. */
.lineout td       { opacity: .55; }
.lineout td:first-child input { text-decoration: line-through; }
table.lines input[type=text]   { width: 100%; }
table.lines input[type=number] { width: 6em; }

/* A batch's swatches (§13ds). The colour patch sits beside the fields rather
   than above them, so a row reads as one thing at a glance down a column of
   three. A swatch with no measured colour draws a dashed outline — an absence
   that says it is one, never a grey standing in for a measurement. */
.swatchrow        { display:flex; gap:12px; align-items:flex-start; }
.swatchrow .swatch{ width:44px; height:44px; border-radius:4px; flex:0 0 auto; }
/* The list's swatches (§13gb). `.swatch` has no size of its own, and these two
   had none either: the colour was recorded and drawn 0×0. An inset line keeps
   a near-white colour visible against the page. */
.swatch.sm{ display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px;
  box-shadow:inset 0 0 0 1px rgba(42,39,36,.28) !important; margin:0 2px 0 0 !important; }
.swatchline{ display:flex; align-items:center; gap:10px; margin:2px 0 10px; }
.swatchline .swatch{ display:inline-block; width:28px; height:28px; border-radius:4px; flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(42,39,36,.28) !important; margin:0 !important; }
/* Studio System (§13gc). The colour arrives as --st (the stage) and --st-tint
   (a light wash of it, so dark text stays readable); the text is always dark. */
.studiobadge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 6px; border-radius:999px;
  background:var(--st-tint); box-shadow:inset 0 0 0 1px var(--st); color:var(--text, #2A2724); font-size:13px;
  line-height:1.3; vertical-align:middle; white-space:nowrap; }
.studiobadge svg{ width:15px; height:15px; color:var(--text, #2A2724); }
.studiobadge .sep{ opacity:.55; }
.box.studio{ box-shadow:inset 4px 0 0 var(--st); }
.box.studio .boxicon{ color:var(--text, #2A2724); background:var(--st-tint); border-radius:6px; }
.box.studio.active{ background:var(--st-tint); box-shadow:inset 4px 0 0 var(--st), inset 0 0 0 2px var(--st); }
.studiocard{ display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start; }
.studioside{ flex:1 1 220px; min-width:0; }
.studiotrail{ overflow-wrap:anywhere; }
.worklabel{ width:70mm; height:40mm; box-sizing:border-box; padding:3mm 4mm 3mm 5.5mm; border-radius:2mm; flex:0 0 auto;
  position:relative; overflow:hidden; background:#FFFDF8; color:#2A2724; border:1px solid #DED8CA;
  display:flex; flex-direction:column; justify-content:space-between; font-family:var(--mono, ui-monospace, monospace); }
/* The stage as a mark, not a fill (§13gf): a thin edge and a dot, in the
   stage's own token. Everything else is dark on light. */
.worklabel::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:1.5mm; background:var(--st); }
.worklabel .wl-id{ font-size:6mm; font-weight:700; letter-spacing:.02em; }
.worklabel .wl-stage{ display:flex; align-items:center; gap:1.4mm; font-size:3.6mm; font-weight:700; }
.worklabel .wl-stage svg{ width:3.8mm; height:3.8mm; flex:0 0 auto; }
.worklabel .wl-dot{ width:2.6mm; height:2.6mm; border-radius:50%; background:var(--st); box-shadow:inset 0 0 0 .25mm rgba(42,39,36,.45); flex:0 0 auto; }
.worklabel .wl-what{ font-size:3.4mm; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.worklabel .wl-date{ font-size:3.2mm; }
#printlabel{ display:none; }
@media print {
  @page { size:70mm 40mm; margin:0; }
  body.printing-label > *:not(#printlabel){ display:none !important; }
  body.printing-label{ background:#fff !important; margin:0; padding:0; }
  body.printing-label #printlabel{ display:block; }
  body.printing-label .worklabel{ border-radius:0; background:#fff; border:none; color:#000;
    -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
/* A sheet of labels on A4 (§13gq): 63.5 × 38.1 mm, 3 × 7, cut on dashed
   lines. The grid draws each line once: the grid its top and left, each label
   its right and bottom. Mono, as the single label is. */
#printsheet{ display:none; }
.sheetpage{ position:relative; width:210mm; height:297mm; box-sizing:border-box; background:#fff;
  break-after:page; page-break-after:always; overflow:hidden; }
.sheetpage:last-child{ break-after:auto; page-break-after:auto; }
.sheetcap{ position:absolute; left:9.75mm; right:9.75mm; top:7mm; font:600 3.4mm/1.2 var(--mono, ui-monospace, monospace); color:#000; }
.sheetgrid{ position:absolute; left:9.75mm; top:15.15mm; display:grid;
  grid-template-columns:repeat(3, 63.5mm); grid-auto-rows:38.1mm;
  border-top:.2mm dashed #8a857c; border-left:.2mm dashed #8a857c; }
.sheetlabel{ position:relative; box-sizing:border-box; width:63.5mm; height:38.1mm; overflow:hidden;
  padding:2.2mm 3mm 2mm 4.2mm; border-right:.2mm dashed #8a857c; border-bottom:.2mm dashed #8a857c;
  display:flex; flex-direction:column; justify-content:space-between; color:#2A2724; background:#fff;
  font-family:var(--mono, ui-monospace, monospace); }
/* The stage as a mark (§13gf): a thin edge and a dot in its token. */
.sheetlabel:not(.blank)::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:1.3mm; background:var(--st); }
.sheetlabel .sl-head{ display:flex; justify-content:space-between; align-items:baseline; gap:2mm; }
.sheetlabel .sl-id{ font-size:4.6mm; font-weight:700; letter-spacing:.02em; white-space:nowrap; }
.sheetlabel .sl-date{ font-size:2.9mm; white-space:nowrap; }
.sheetlabel .sl-stage{ display:flex; align-items:center; gap:1.2mm; font-size:3mm; font-weight:700; white-space:nowrap; overflow:hidden; }
.sheetlabel .sl-stage svg{ width:3.2mm; height:3.2mm; flex:0 0 auto; }
.sheetlabel .sl-dot{ width:2.3mm; height:2.3mm; border-radius:50%; background:var(--st); box-shadow:inset 0 0 0 .22mm rgba(42,39,36,.45); flex:0 0 auto; }
.sheetlabel .sl-fin{ font-weight:400; margin-left:1mm; }
.sheetlabel .sl-row{ display:flex; align-items:baseline; gap:1.5mm; font-size:2.8mm; min-height:4.6mm;
  border-bottom:.15mm solid #b9b3a8; }
.sheetlabel .sl-cap{ flex:0 0 auto; color:#5C574E; }
.sheetlabel .sl-val{ flex:1 1 auto; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:#000; }
.sheetlabel .sl-line{ display:inline-block; width:16mm; border-bottom:.15mm solid #b9b3a8; height:3.5mm; vertical-align:bottom; }
.sheetlabel .sl-line.short{ width:13mm; }
.sheetlabel .sl-boxes{ gap:2.2mm; font-weight:600; }
.sheetlabel .sl-box{ display:inline-flex; align-items:center; gap:.8mm; }
.sheetlabel .sl-tick{ width:2.8mm; height:2.8mm; border:.2mm solid #2A2724; box-sizing:border-box; }
/* For coloured paper: nothing coloured at all. */
.sheetpage.ink .sheetlabel::before{ display:none; }
.sheetpage.ink .sl-dot{ display:none; }
@media print {
  body.printing-sheet > *:not(#printsheet){ display:none !important; }
  body.printing-sheet{ background:#fff !important; margin:0; padding:0; }
  body.printing-sheet #printsheet{ display:block; }
  body.printing-sheet .sheetpage:not(.ink) .sheetlabel{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
.processsummary th{ text-align:left; font-weight:500; color:var(--muted, #5C574E); padding:5px 14px 5px 0; vertical-align:top; white-space:nowrap; }
.processsummary td{ padding:5px 0; overflow-wrap:anywhere; }
/* Plan, read (§13gb). */
.plannotes{ white-space:normal; line-height:1.55; margin:8px 0 10px; }
.checkitem .checktext{ flex:1 1 auto; padding:6px 0; overflow-wrap:anywhere; }
.planref{ display:block; max-width:100%; height:auto; border-radius:var(--radius); border:1px solid var(--line); }
.swatchfields     { flex:1 1 auto; min-width:0; }
.swatchfields .field input[type=text],
.swatchfields .field select { width:100%; }
label.inline      { display:inline-flex; gap:6px; align-items:center; margin-left:10px;
                    font-size:12.5px; color:var(--muted); }
@media (max-width: 560px) {
  .swatchrow { flex-wrap:wrap; }
  .swatchfields { flex-basis:100%; }
}

/* ======================================================================
   Editorial redesign, package 1 (design/editorial-redesign, from rc98).
   The v0 exploration's composition — typography, spacing, radii, the
   two-row bar — in Bagra's own palette: indigo marks where one is and
   what is chosen; controls are neutral; no green anywhere (fixed decision).
   A layer at the end of the sheet, so it wins by order and the earlier
   rules it overrides stay readable beside it.
   ====================================================================== */

:root{
  --sans:'Geist Variable',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:'Source Serif 4 Variable',Georgia,"Times New Roman",serif;
  /* Neutrals derived from the palette, not new hues. */
  --sunk:#ECE7DD;              /* ground mixed toward line: pressed and hovered */
  --specimen:#FBFBF9;          /* the mat a colour sits on — neutral, not cream */
  --specimen-line:#E7E6E0;
  --indigo-tint:rgba(44,59,87,.09);
  --h-dialog:19px;             /* a dialog's title: not a section heading, its own step */
  --radius-ctl:8px;            /* buttons, fields */
  --radius-card:14px;          /* cards */
  --radius-panel:18px;         /* panels, tables, dialogs */
  --bar:1280px;
}
body{font-family:var(--sans);font-size:15px;line-height:1.55;font-feature-settings:"kern"}
html[lang="bg"] body{font-feature-settings:"kern","locl"}

/* ---------- headings and reading text ---------- */
h1{font-family:var(--serif);font-weight:500;font-size:34px;letter-spacing:-.012em;line-height:1.12}
/* p.sub only: the plant profile's sections are also `.sub` (see rc89). */
p.sub{font-family:var(--serif);font-size:16.5px;line-height:1.5;color:var(--muted)}
/* Size from the one scale (§13bg, check-scope); only the tracking is the redesign's. */
h2{letter-spacing:.15em;font-weight:600}
.prose{font-family:var(--serif);font-size:16px;line-height:1.62}
/* The working register: steps read over a pot stay in the working face. */
.workstep .prose{font-family:var(--sans);font-size:15px;line-height:1.55}
.latin{font-family:var(--serif);font-size:14.5px}
.emptystate{font-family:var(--serif);font-size:16px}

/* ---------- surfaces ---------- */
.panel{border-radius:var(--radius-panel);padding:22px;border-color:var(--line)}
.panel.flush{padding:0}
.note{border-radius:var(--radius-ctl)}
.chip{border-radius:999px}
.box{border-radius:var(--radius-card)}
.box.active{border-color:var(--indigo);background:var(--indigo);color:#fff}

/* ---------- controls ---------- */
.btn{border-radius:var(--radius-ctl);padding:9px 16px;font-size:14px;font-weight:500;border-color:var(--line);background:var(--surface);transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--muted);background:var(--surface)}
/* The primary action is neutral — iron — because indigo is for where one is
   and what is chosen, not for what one might do next (the palette rule). */
.btn.primary{background:var(--iron);border-color:var(--iron);color:var(--surface)}
.btn.primary:hover{background:var(--ink);border-color:var(--ink)}
.btn.quiet{background:none;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--madder)}
.btn.danger:hover{border-color:var(--madder)}
.btn.contextual{padding:7px 11px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-ctl);padding:9px 11px;font-size:14.5px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--indigo);outline-offset:-1px;border-color:var(--indigo)}
.fieldlabel{font-size:12.5px;letter-spacing:.01em}
.searchbox{border-radius:var(--radius-ctl);background:var(--surface)}
.langbtn{border-radius:var(--radius-ctl)}
.langbtn[aria-pressed="true"]{border-color:var(--indigo);color:var(--indigo);background:var(--indigo-tint)}

/* ---------- colour specimens: a neutral mat, never cream ---------- */
.refswatch,.swatchblock,.miniswatch{
  box-shadow:0 0 0 3px var(--specimen),0 0 0 4px var(--specimen-line);margin:4px}

/* ---------- dialog ---------- */
.modal{border-radius:var(--radius-panel);padding:22px 24px}
.modal h2{font-family:var(--serif);font-size:var(--h-dialog);letter-spacing:0;text-transform:none;color:var(--ink);font-weight:500}

/* ---------- the page ---------- */
.app{display:block;min-height:0}
/* The view takes focus on every screen change so a screen reader starts at the
   page; the ring that drew round the whole page on a mouse click said nothing. */
.view:focus{outline:none}
.view{max-width:var(--bar);padding-top:30px}

/* ---------- the bar: two rows on a laptop ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px)}
.toprow,.modrow{max-width:var(--bar);margin-inline:auto;padding-inline:var(--pad)}
.toprow{display:flex;align-items:center;gap:14px;min-height:60px}
.topbar svg,.morepanel svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand{border:0;background:none;cursor:pointer;display:flex;flex-direction:row;align-items:baseline;gap:9px;padding:6px 2px;min-height:44px;color:var(--ink)}
.brand b{font-family:var(--serif);font-size:23px;font-weight:500;letter-spacing:-.01em}
.brand span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.spaces{display:flex;gap:4px;margin-left:6px}
.spacebtn{display:inline-flex;align-items:center;gap:8px;border:0;background:none;border-radius:var(--radius-ctl);
  padding:9px 13px;min-height:42px;font-size:14.5px;color:var(--muted);cursor:pointer}
.spacebtn:hover{background:var(--sunk);color:var(--ink)}
.spacebtn[aria-current]{background:var(--indigo-tint);color:var(--indigo);font-weight:600}
.overflow{margin-left:auto;position:relative}
.overflowbtn{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--radius-ctl);color:var(--muted);cursor:pointer}
.overflowbtn:hover{border-color:var(--muted);color:var(--ink)}
.overflowbtn[aria-current]{border-color:var(--indigo);color:var(--indigo)}
.overflowmenu{position:absolute;right:0;top:calc(100% + 6px);width:252px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-card);padding:6px;z-index:40;
  box-shadow:0 18px 40px -22px rgba(42,39,36,.45)}
.overflowitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;
  border-radius:var(--radius-ctl);padding:10px 10px;min-height:42px;font-size:14px;color:var(--ink);cursor:pointer}
.overflowitem:hover{background:var(--sunk)}
.overflowitem[aria-current="page"]{background:var(--indigo-tint);color:var(--indigo);font-weight:600}
.overflowrow{display:flex;gap:4px;align-items:center;padding:8px 8px 4px;margin-top:4px;border-top:1px solid var(--line)}
.overflowrow.version{font-size:12px;color:var(--muted)}
.modrow{display:flex;gap:4px;overflow-x:auto;padding-block:8px;border-top:1px solid var(--line);scrollbar-width:none}
.modrow::-webkit-scrollbar{display:none}
.modbtn{display:inline-flex;align-items:center;gap:7px;flex:none;border:0;background:none;border-radius:var(--radius-ctl);
  padding:8px 13px;min-height:38px;font-size:14px;color:var(--muted);cursor:pointer}
.modbtn:hover{background:var(--sunk);color:var(--ink)}
.modbtn[aria-current="page"]{background:var(--indigo);color:#fff}
.menubtn,.mobiletitle{display:none}
.topbar button:focus-visible,.morepanel button:focus-visible{outline:2px solid var(--indigo);outline-offset:1px}

/* ---------- the phone: a header and a drawer ---------- */
@media (max-width:820px){
  .spaces,.modrow,.overflow,.brand{display:none}
  .toprow{min-height:56px;gap:6px;padding-inline:8px}
  .menubtn{display:grid;place-items:center;width:44px;height:44px;border:0;background:none;border-radius:var(--radius-ctl);color:var(--ink);cursor:pointer}
  .menubtn svg{width:22px;height:22px}
  .mobiletitle{display:block;font-family:var(--serif);font-size:19px;font-weight:500;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .view{padding:20px 14px calc(36px + env(safe-area-inset-bottom,0px))}
  h1{font-size:28px}
}
.moresheet{position:fixed;inset:0;z-index:50;display:flex;align-items:stretch;justify-content:flex-start;
  background:rgba(42,39,36,.32)}
.morepanel{width:min(310px,86vw);max-height:none;height:100%;overflow-y:auto;background:var(--surface);
  border-radius:0 var(--radius-panel) var(--radius-panel) 0;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(18px + env(safe-area-inset-bottom,0px));
  box-shadow:18px 0 40px -24px rgba(42,39,36,.5)}
.morehead{padding:4px 4px 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.drawerbrand{font-family:var(--serif);font-size:22px;font-weight:500}
.morepanel .navhead{padding:14px 10px 4px}
.drawerlist{display:flex;flex-direction:column;gap:2px}
.draweritem{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;text-align:left;
  border-radius:var(--radius-ctl);padding:10px 10px;min-height:44px;font-size:15px;color:var(--ink);cursor:pointer}
.draweritem:hover{background:var(--sunk)}
.draweritem[aria-current="page"]{background:var(--indigo);color:#fff}
.morepanel .langrow{border-top:1px solid var(--line);margin-top:12px;padding:12px 6px 0}

/* ======================================================================
   Editorial redesign, package 2 — the reference part (1.1.0-design.2).
   Scoped to the reference space (`#view[data-space="reference"]`, set by
   the router) or to one module, so the diary and pigments are untouched
   until package 3. Visual only: every control, field and route is the one
   the module already draws.
   ====================================================================== */
:root{--h-term:17px}          /* a glossary term's name, in the scale */

/* The page header: the space's name above, a rule below. */
.kicker{margin:0 0 7px;font-size:10.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
#view[data-space="reference"] .pagehead,#view[data-space="diary"] .pagehead{align-items:flex-end;padding-bottom:20px;margin-bottom:26px;border-bottom:1px solid var(--line)}
#view[data-space="reference"] h1,#view[data-space="diary"] h1{font-size:36px}
#view[data-space="reference"] p.sub,#view[data-space="diary"] p.sub{margin-top:6px;max-width:68ch}

/* Tables: a rounded panel, a sunk header row, room in the cells. Above the
   phone only — below 640px a table is stacked records (§13ae). */
#view[data-space="reference"] .panel.flush,#view[data-space="diary"] .panel.flush{border-radius:var(--radius-panel)}
@media (min-width:641px){
  #view[data-space="reference"] .grid th,#view[data-space="diary"] .grid th{background:var(--sunk);font-size:10.5px;font-weight:600;letter-spacing:.14em;padding:12px 16px}
  #view[data-space="reference"] .grid td,#view[data-space="diary"] .grid td{padding:13px 16px}
  #view[data-space="reference"] .grid tbody tr:hover,#view[data-space="diary"] .grid tbody tr:hover{background:var(--ground)}
}

/* Filters: pills. The chosen one is indigo — a state, not a decoration. */
#view[data-space="reference"] .boxes .box,#view[data-space="diary"] .boxes .box{border-radius:999px;padding:7px 15px}
#view[data-space="reference"] .boxes .box.active,#view[data-space="diary"] .boxes .box.active{background:var(--indigo);border-color:var(--indigo)}
#view[data-space="reference"] .searchbox,#view[data-space="diary"] .searchbox{min-height:44px;max-width:520px}

/* Tabs — the segmented switch and the Library's three. */
#view[data-space="reference"] .tabswitch,#view[data-space="diary"] .tabswitch{border-radius:999px;padding:3px;gap:2px}
#view[data-space="reference"] .tabswitch .tab,#view[data-space="diary"] .tabswitch .tab{border-radius:999px;padding:7px 16px}
#view[data-module="library"] .tabs{display:inline-flex;gap:2px;padding:3px;margin:0 0 22px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
#view[data-module="library"] .tabs .tab{display:inline-flex;align-items:center;min-height:38px;padding:7px 18px;border-radius:999px;
  text-decoration:none;color:var(--muted);font-size:14px}
#view[data-module="library"] .tabs .tab:hover{background:var(--sunk);color:var(--ink)}
#view[data-module="library"] .tabs .tab.on{background:var(--indigo);color:#fff}
@media (max-width:820px){#view[data-module="library"] .tabs .tab{min-height:44px}}

/* Cards — result cards, colour cards, technique cards. */
#view[data-space="reference"] .refcard{border-radius:var(--radius-card);padding:14px;background:var(--surface);border-color:var(--line)}
#view[data-space="reference"] .refcard:hover{border-color:var(--muted)}
#view[data-space="reference"] .techcards{gap:14px}
#view[data-space="reference"] .techcard{border-radius:var(--radius-card);padding:18px 20px;background:var(--surface)}
#view[data-space="reference"] .techcard:hover{border-color:var(--muted)}
#view[data-space="reference"] .techname{font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.25}
#view[data-space="reference"] .techdesc{font-size:13.5px;line-height:1.55}

/* The glossary: a definition list — the term in the serif on the left, the
   definition beside it — in one panel, as the prototype's Library. */
#view[data-module="library"] .cards:has(> .glossterm){display:block;border:1px solid var(--line);border-radius:var(--radius-panel);
  background:var(--surface);overflow:hidden}
#view[data-module="library"] .glossterm{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:4px 28px;
  margin:0;padding:16px 22px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none}
#view[data-module="library"] .glossterm:last-child{border-bottom:0}
#view[data-module="library"] .termname{grid-row:1 / span 2;margin:0;font-family:var(--serif);font-size:var(--h-term);font-weight:500;line-height:1.3}
#view[data-module="library"] .termdef{grid-column:2;font-family:var(--serif);font-size:15.5px;line-height:1.6;max-width:var(--measure)}
#view[data-module="library"] .termfoot{grid-column:2}
@media (max-width:640px){
  #view[data-module="library"] .glossterm{grid-template-columns:minmax(0,1fr);padding:14px 16px}
  #view[data-module="library"] .termname{grid-row:auto}
  #view[data-module="library"] .termdef,#view[data-module="library"] .termfoot{grid-column:1}
}

/* Calculators: a grid of cards, not a list. */
#view[data-module="tools"] .picklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px;
  border:0;background:none;overflow:visible}
#view[data-module="tools"] .pickrow{border:1px solid var(--line);border-radius:var(--radius-card);background:var(--surface);padding:16px 18px;min-height:76px}
#view[data-module="tools"] .picklist .pickrow:last-child{border-bottom:1px solid var(--line)}
#view[data-module="tools"] .pickrow:hover{border-color:var(--muted);background:var(--surface)}
#view[data-module="tools"] .pickrow svg{stroke:var(--muted)}
#view[data-module="tools"] .pickname b{font-family:var(--serif);font-size:17px;font-weight:500}
#view[data-module="tools"] .pickgroup + .pickgroup{margin-top:18px}

/* The plant's headline: its photograph on the specimen mat, larger. */
/* The figure grows with it (it is held to 96px by .plantshot), and the mat is
   padding inside the figure rather than a ring outside it, so nothing overlaps. */
#view[data-space="reference"] .headline .plantshot{flex:0 0 132px;max-width:132px}
#view[data-space="reference"] .headline .plantshot img{display:block;width:132px;height:132px;flex:none;padding:5px;
  background:var(--specimen);border:1px solid var(--specimen-line);border-radius:var(--radius-card)}
@media (max-width:640px){#view[data-space="reference"] .headline .plantshot{flex:0 0 auto;max-width:100%}}
#view[data-space="reference"] .plantphoto{box-shadow:0 0 0 4px var(--specimen),0 0 0 5px var(--specimen-line)}

/* On a phone a chain step's line wraps — number, name, kind and „Open recipe"
   did not fit in one line, and ran the page 11px past the edge (rc98: 25px). */
@media (max-width:640px){
  #view[data-space="reference"] .panel,#view[data-space="diary"] .panel{padding:16px}
  #view[data-space="reference"] .chainhead{flex-wrap:wrap;row-gap:6px}
  #view[data-space="reference"] .cols > .col,#view[data-space="diary"] .cols > .col{min-width:0}
}

/* The recipe's working view: the weigh list on the sunk surface. */
#view[data-space="reference"] .weighbox,#view[data-space="reference"] .weighlist{border-radius:var(--radius-card)}

/* ======================================================================
   Editorial redesign, package 3 — the diary (1.1.0-design.3).
   My work, Fabrics, preparation, group actions, the work form, the
   result, the history and their editors and dialogs, in the same visual
   language; scoped to `#view[data-space="diary"]`. Visual only: the
   model, `prepActionIds`, inherited actions at a cut, group batches,
   recipes, photographs, history and the delete guards are untouched.
   The pigments' model is not this package's business — they take the
   shared surfaces and nothing else.
   ====================================================================== */

/* Work cards: a record card with room, its title in the serif. */
#view[data-space="diary"] .workrow{border-radius:var(--radius-card);padding:14px;background:var(--surface);gap:14px}
#view[data-space="diary"] .workrow:hover{border-color:var(--muted)}
#view[data-space="diary"] .workrow > div > b,#view[data-space="diary"] .workrow b:first-of-type{
  font-family:var(--serif);font-size:17px;font-weight:500;line-height:1.25}
#view[data-space="diary"] .workthumb{width:64px;height:64px;border-radius:var(--radius-ctl)}
#view[data-space="diary"] .workrowwrap{margin-bottom:10px}
/* On a phone the progress strip takes a row of its own under the text
   (package 4). The card is a grid, and the strip is 150px that cannot shrink:
   in one row with the name it left the name 68px at 390px and NOTHING at
   320px. Nothing is dropped — every stage still shows; the strip simply stops
   competing with the name. (Package 3 tried this with flex properties, which a
   grid ignores, and the card overflowed; this is the same idea done right.) */
@media (max-width:640px){
  #view[data-space="diary"] .workrow{grid-template-columns:56px minmax(0,1fr) 16px;row-gap:10px}
  #view[data-space="diary"] .workgo{grid-column:3;grid-row:1}
  #view[data-space="diary"] .workprog{grid-column:1 / -1;min-width:0}
  #view[data-space="diary"] .workprog .progline.compact{min-width:0;width:100%}
}


/* The work form: stage cards, their heads on the sunk surface, roomier lines. */
#view[data-space="diary"] .workcol{gap:16px}
#view[data-space="diary"] .stagecard{border-radius:var(--radius-card)}
#view[data-space="diary"] .stagecardhead{background:var(--sunk);padding:12px 16px}
#view[data-space="diary"] .stagecardhead.sub{background:none;padding:10px 16px}
#view[data-space="diary"] .stagecardhead b{font-size:11px;letter-spacing:.14em;font-weight:600}
#view[data-space="diary"] .stepline{padding:12px 16px}
#view[data-space="diary"] .stepline.read{padding:10px 16px}
#view[data-space="diary"] .prepcard{border-radius:var(--radius-card);padding:16px}
#view[data-space="diary"] .prepcardhead b{font-family:var(--serif);font-size:16px;font-weight:500}

/* Finishing: the questions numbered as in the prototype's steps. */
#view[data-space="diary"] .finishq{border-radius:var(--radius-card);padding:18px 20px}
#view[data-space="diary"] .finishnum{background:var(--indigo);color:#fff;border-color:var(--indigo)}
#view[data-space="diary"] .finishask{font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.3}

/* The result's colour specimens sit on the neutral mat (the swatch itself
   already carries it; the caption keeps its place). */
#view[data-space="diary"] .reviewswatches{gap:18px}

/* The group action: the same panels, the quantities on the sunk surface. */
#view[data-module="batch"] .scaledbox{border-radius:var(--radius-card);background:var(--sunk);padding:14px 16px}
#view[data-module="batch"] .pickbox{border-radius:var(--radius-card)}
#view[data-module="batch"] .summaryline{border-radius:var(--radius-card)}
#view[data-module="batch"] .stepnum{background:var(--indigo);color:#fff}

/* A piece: its history reads as a column of events; the photographs bigger. */
#view[data-module="fabrics"] .timeline{padding-left:2px}
#view[data-module="fabrics"] .tl{padding-bottom:18px}
#view[data-module="fabrics"] .thumb{width:48px;height:48px;border-radius:var(--radius-ctl)}

/* Editors: the form beside its rail, as the prototype's FormScaffold — the
   rail falls under the fields on a narrow screen (it already does). */
#view[data-space="diary"] .cols{gap:22px}
@media (min-width:1024px){
  #view[data-module="fabrics"] .cols > .col:last-child{position:sticky;top:96px;align-self:start}
}

/* ======================================================================
   Editorial redesign, package 4 — integration and finishing (1.1.0-design.4).
   The pigments in the approved language; the screens the exploration never
   drew (group actions, the backup, the pack preview, About, the stubs); the
   edge states; and the phone. Visual only: no model, no calculation, no
   behaviour. The pigments keep their own model — this touches their
   surfaces.
   ====================================================================== */

/* The page header everywhere, not only in the two spaces: Home and the
   screens outside them get the same rule under the title. */
#view .pagehead{align-items:flex-end;padding-bottom:20px;margin-bottom:26px;border-bottom:1px solid var(--line)}
#view h1{font-size:36px}
@media (max-width:640px){#view h1{font-size:28px}#view .pagehead{padding-bottom:16px;margin-bottom:20px}}

/* Edge states: one card for empty, loading and error, as the prototype's
   EmptyState — a dashed edge so it reads as a place with nothing in it
   rather than as a panel that failed to draw. */
.emptystate{border:1px dashed var(--line);border-radius:var(--radius-panel);background:var(--surface);padding:42px 24px}
.emptystate p:first-child{color:var(--ink)}
.panel .emptystate{border:0;background:none;padding:26px 8px}

/* Home, beside the two finished spaces: the same cards, the same radii. */
#view[data-module="dashboard"] .tile,#view[data-module="dashboard"] .contcard{border-radius:var(--radius-card)}
#view[data-module="dashboard"] .tilename{font-family:var(--serif);font-size:16px;font-weight:500}
#view[data-module="dashboard"] .contlabel{font-family:var(--serif);font-size:17px;font-weight:500;line-height:1.25}
#view[data-module="dashboard"] .seasonhead h2{letter-spacing:.15em}
@media (max-width:640px){#view[data-module="dashboard"] .contcards{grid-template-columns:1fr}}

/* Pigments: the batch's colours on the neutral mat, its stages numbered in
   indigo, its two columns with the same gap as the other editors. */
#view[data-module="pigments"] .swatch{box-shadow:0 0 0 3px var(--specimen),0 0 0 4px var(--specimen-line);margin:4px}
#view[data-module="pigments"] .stepno{background:var(--indigo);color:#fff;border-color:var(--indigo)}
#view[data-module="pigments"] .pigmentcols{gap:22px}
#view[data-module="pigments"] .contextstrip{border-radius:var(--radius-card);background:var(--surface)}
@media (max-width:900px){#view[data-module="pigments"] .pigmentcols{grid-template-columns:minmax(0,1fr)}}

/* About: its four sections as the Library's pills. */
#view[data-module="about"] .tabs{display:inline-flex;gap:2px;padding:3px;margin:0 0 6px;border:1px solid var(--line);
  border-radius:999px;background:var(--surface);flex-wrap:wrap}
#view[data-module="about"] .tabs a{display:inline-flex;align-items:center;min-height:38px;padding:7px 16px;border-radius:999px;
  text-decoration:none;color:var(--muted);font-size:14px}
#view[data-module="about"] .tabs a:hover{background:var(--sunk);color:var(--ink)}
#view[data-module="about"] .tabs a.on{background:var(--indigo);color:#fff}
@media (max-width:820px){#view[data-module="about"] .tabs a{min-height:44px}}

/* The pack preview — the one screen that writes over her library, so its rows
   read like a table: the record, then what changes. */
.difgroup{border:1px solid var(--line);border-radius:var(--radius-panel);background:var(--surface);overflow:hidden}
.difhead{background:var(--sunk);padding:12px 16px}
.difrow{padding:12px 16px}
.difname{font-family:var(--serif);font-size:16px;font-weight:500}

/* The backup and the other rare screens keep the shared surfaces; only their
   radii were the older ones. */
#view[data-module="tools"] .note,#view[data-module="about"] .note,#view[data-module="packs"] .note{border-radius:var(--radius-ctl)}

/* ======================================================================
   Editorial redesign, package 5 — the approved composition on real data
   (1.1.0-design.5). No new design: the v0 screens applied more closely, on
   the width a laptop actually has. No field, action or record changed.
   ====================================================================== */

/* A finished work: the photograph large, the figures beside it, everything
   else across the section. The 820px column was the working form's measure
   and made a 1440px screen read at half width. */
.reviewcol{max-width:none}
.reviewtop{display:grid;gap:16px;align-items:stretch}
@media (min-width:1024px){.reviewtop{grid-template-columns:minmax(0,0.72fr) minmax(280px,0.28fr)}}
.reviewhero img{max-height:none;aspect-ratio:16 / 10}
.reviewparams{display:flex;flex-direction:column;justify-content:flex-start;background:var(--sunk);margin:0}
.reviewparams .reviewfacts{flex-direction:column;flex-wrap:nowrap;gap:0;margin-top:6px}
.reviewparams .reviewfact{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  padding:9px 0;border-bottom:1px solid var(--line)}
.reviewparams .reviewfact:last-child{border-bottom:0}
#view[data-space="diary"] .reviewswatches{gap:18px}
.reviewcol .story{max-width:none}
/* „How it went": the stages across the width, not one under another. */
@media (min-width:1100px){
  .reviewcol .foldbody{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;align-items:start}
  .reviewcol .foldbody > *{border:1px solid var(--line);border-radius:var(--radius-card);background:var(--surface);margin:0}
  .reviewcol .procrow > summary{padding:12px 14px}
  .reviewcol .procrow .procbody{padding:0 14px 12px}
  .reviewcol .procrow.fixed{padding:12px 14px}
}

/* A plant's profile: the width belongs to the section, not to the paragraph.
   The measure held every text to 74/120ch inside sections that were already
   half a screen wide, so lines broke twice over. */
#view[data-module="plants"] .prose,#view[data-module="plants"] .termdef{max-width:none}
/* One column, and no width of its own (rc100): the section decides how wide
   the description is, exactly as it decides for everything else in the card. */
#view[data-module="plants"] .plantintro{max-width:none;font-size:17px}

/* The Reference's results: a card each, its colour first and big. */
.resultgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.resultcard{display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;cursor:pointer;
  border:1px solid var(--line);border-radius:var(--radius-card);background:var(--surface);color:inherit;font:inherit}
.resultcard:hover{border-color:var(--muted)}
.resultcard.on{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo)}
.resultswatch{display:flex;align-items:center;justify-content:center;height:74px;width:100%;
  border-bottom:1px solid var(--specimen-line);background:var(--specimen);position:relative}
.resultswatch .approx{position:absolute;right:8px;bottom:4px;font-size:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.resultbody{display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px}
.resulttop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.resulttop b{font-family:var(--serif);font-size:16px;font-weight:500;line-height:1.25}
.resultfields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.resultfield{display:flex;flex-direction:column;gap:1px;min-width:0}
.resultfield span:last-child{font-size:13px;color:var(--ink);overflow-wrap:anywhere}
@media (min-width:1280px){.refsplit{grid-template-columns:minmax(0,1.6fr) minmax(300px,0.9fr)}}
@media (max-width:820px){.refsplit{grid-template-columns:minmax(0,1fr)}.refaside{position:static}}

/* My work: fewer, wider cards, each the same height with its actions inside. */
#view[data-module="trials"] .trialgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
#view[data-module="trials"] .piececard{display:flex;flex-direction:column;height:100%}
#view[data-module="trials"] .trialcard{flex:1;display:flex;flex-direction:column;border-radius:var(--radius-card)}
#view[data-module="trials"] .trialphoto{aspect-ratio:4 / 3;width:100%}
#view[data-module="trials"] .trialphoto img{width:100%;height:100%;object-fit:cover}
#view[data-module="trials"] .trialmeta{flex:1;display:flex;flex-direction:column;gap:5px;padding:12px 14px}
#view[data-module="trials"] .trialmeta b{font-family:var(--serif);font-size:16px;font-weight:500;line-height:1.25}
#view[data-module="trials"] .earlierruns{border:1px solid var(--line);border-top:0;
  border-radius:0 0 var(--radius-card) var(--radius-card);padding:8px 12px}

/* A wide screen is a wide screen: the working column may use it. */
@media (min-width:1280px){
  #view[data-module="fabrics"] .cols,#view[data-space="diary"] .cols{gap:26px}
}

/* ======================================================================
   About and Getting started (rc102): the texts grew from four paragraphs to
   five sections, so they need a hierarchy and a rhythm to be read. Scoped to
   the one module; no typography changed anywhere else.
   ====================================================================== */
#view[data-module="about"] .panel > h2 + p{margin-top:2px}
#view[data-module="about"] h3{font-size:var(--h-sub);font-weight:600;color:var(--ink);
  margin:26px 0 8px;letter-spacing:0;text-transform:none}
#view[data-module="about"] p{margin:0 0 12px;line-height:1.62;max-width:var(--measure)}
#view[data-module="about"] ul{margin:0 0 12px;padding-left:20px;max-width:var(--measure)}
#view[data-module="about"] li{margin:0 0 6px;line-height:1.55}
#view[data-module="about"] .figure.flow{font-family:var(--serif);font-size:17px;color:var(--ink);
  background:var(--sunk);border-radius:var(--radius-ctl);padding:10px 14px;display:inline-block;margin:0 0 12px}
@media (min-width:1024px){
  /* The reading text keeps a comfortable measure inside a wide panel; the
     panel itself still uses the page. */
  #view[data-module="about"] .panel{padding:26px 30px}
}
</style>
